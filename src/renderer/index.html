<!doctype html>
<html lang="zh-CN" data-page="a" data-state="populated" data-rm="0" data-rotate="1">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Agent Monitor</title>
<!--
  纯净视图：没有控制栏，body 就是 --canvas。画布宽度按 panelX 收窄（480 / 1.19 = 403），
  stage 用非等比 transform 拉回 960×540——面板缩放器把这一屏横向压了 15.6%，这是补偿。
  ?debug=1 时底部浮出原型的控制栏（七态 / 模拟 / 轮播开关 / reduced-motion），
  它是 position:fixed 的工具层，不进画布。
  字体自带（@fontsource），CSP 也不放行外部域 —— 面板不连网。
-->
</head>
<body>

<div class="stage" id="stage">
  <div class="screen">
    <h1 class="sr">Agent Monitor 副屏面板</h1>
    <div class="topbar">
      <span class="loading-label" id="topLoading" hidden>读取中</span>
      <span class="tb-right"><span class="clock" id="clock" data-clock>--:--</span><span class="unread" id="unread"></span></span>
    </div>
    <div class="pages" id="pages">
      <section class="page page-a" data-p="a"><h2 class="sr">额度总览</h2><div class="tiles" id="paTiles"></div></section>
      <section class="page page-b" data-p="b"><h2 class="sr">额度详情</h2><div class="bands" id="pbBands"></div></section>
      <section class="page page-c" data-p="c1"><h2 class="sr" id="feedTitle">最近的 session</h2><div class="feed" id="pc1Feed"></div></section>
      <section class="page page-c" data-p="c2"><h2 class="sr">更早的 session</h2><div class="feed" id="pc2Feed"></div></section>
      <section class="page page-d" data-p="d"><h2 class="sr">每日用量</h2><div class="dwrap" id="pdHeat"></div></section>
      <section class="page page-e" data-p="e"><h2 class="sr">今日 AI 大事</h2><div class="ewrap" id="peNews"></div></section>
      <!-- F 页：左边是像素场景（canvas 固定 224×128，猫框 96×96），
           右边三个数 + 一行文案。场景是纯装饰，它说的每件事文案里都有，所以对无障碍树隐藏。 -->
      <section class="page page-f" data-p="f"><h2 class="sr">Midi 打字伴侣</h2>
        <div class="fwrap">
          <!-- 场景下方居中一粒「换班」。这是副屏上除翻页外唯一的按钮：托盘图标在满的菜单栏里会被藏掉，换猫得有条不靠托盘的路。
               放在场景正下方而不是右栏：右栏的底角落在 15% 宽的翻页热区里，会被它盖住。 -->
          <div class="f-stage">
            <canvas class="f-scene" id="pfScene" width="224" height="128" aria-hidden="true"></canvas>
            <button type="button" class="f-swap" id="pfSwap" aria-label="换班：让另一只猫来接班">换班</button>
          </div>
          <div class="f-side"><div class="f-stats" id="pfStats"></div><p class="f-state" id="pfState"></p></div>
        </div>
      </section>
      <section class="page page-attn" data-p="attn"><h2 class="sr">需要你</h2><div id="paAttn"></div></section>
      <button type="button" class="edge" data-side="prev" aria-label="上一页"></button>
      <button type="button" class="edge" data-side="next" aria-label="下一页"></button>
      <!-- 指示点由 renderDots 按「当前在轮播里的页」重画（C2 空时少一个），
           所以这里是空的；holdmark 也在那次重画里重建。 -->
      <div class="dots" id="dots" data-not-accent></div>
    </div>
  </div>
  <!-- panelX（M3 附加节）：⌃⌥] / ⌃⌥[ 调 ±0.02 后闪显 1 s；⌃⌥C 切校准叠层。
       两者都在 .stage 内部 —— 校准圆必须和画布受同一份横向拉伸，才能靠它定系数。 -->
  <div class="panelx-flash" id="panelxFlash" aria-hidden="true"></div>
  <div class="calib" id="calib" aria-hidden="true">
    <div class="cross-h"></div><div class="cross-v"></div>
    <div class="ring"></div>
    <div class="hint" id="calibHint">⌃⌥] / ⌃⌥[ 调到正圆 · ⌃⌥C 关闭</div>
  </div>
  <p class="sr" role="status" aria-live="polite" id="live"></p>
</div>

<div class="harness" id="harness">
  <div class="hgroup"><b>页</b>
    <div class="seg" id="segPage" role="group" aria-label="切换页">
      <button type="button" data-p="a" aria-pressed="true">A</button>
      <button type="button" data-p="b" aria-pressed="false">B</button>
      <button type="button" data-p="c1" aria-pressed="false">C1</button>
      <button type="button" data-p="c2" aria-pressed="false">C2</button>
      <button type="button" data-p="d" aria-pressed="false">D</button>
      <button type="button" data-p="e" aria-pressed="false">E</button>
      <button type="button" data-p="f" aria-pressed="false">F</button>
      <button type="button" data-p="attn" aria-pressed="false">attn</button>
    </div>
  </div>
  <div class="hgroup">
    <label class="hcheck"><input type="checkbox" id="chkRotate" checked> 自动轮播</label>
    <span class="hmeter" id="meter">A · 60.0s</span>
  </div>
  <div class="hgroup"><b>状态</b>
    <div class="seg" id="segState" role="group" aria-label="切换状态">
      <button type="button" data-s="populated" aria-pressed="true">populated</button>
      <button type="button" data-s="loading"   aria-pressed="false">loading</button>
      <button type="button" data-s="empty"     aria-pressed="false">empty</button>
      <button type="button" data-s="error"     aria-pressed="false">error</button>
      <button type="button" data-s="edge"      aria-pressed="false">edge</button>
      <button type="button" data-s="attention" aria-pressed="false">attention</button>
      <button type="button" data-s="running"   aria-pressed="false">running</button>
      <button type="button" data-s="full"      aria-pressed="false">full</button>
    </div>
  </div>
  <div class="hgroup">
    <button type="button" class="hbtn" id="btnPush">模拟新事件</button>
    <button type="button" class="hbtn" id="btnAttn">模拟等待批准</button>
    <button type="button" class="hbtn" id="btnType">模拟打字 60 字</button>
    <label class="hcheck"><input type="checkbox" id="chkRm"> reduced-motion</label>
  </div>
</div>

<script type="module" src="./app.ts"></script>
</body>
</html>
