================================================================================
AGENT MONITOR — M0 轮播版
画布 480×270 CSS px，整体 zoom:2 铺满 960×540（1 画布 px = 4×4 物理像素 = 0.16 mm）
视觉真源 DESIGN.md (raycast) · token 见 design/tokens.css（下方内联副本逐字相同）
简报 design/brief-m0-rotation.md（在 brief-m0.md / brief-m0-35.md 之上的差量）
前身：3.5 寸单屏版 design/variations-35-single.html · 960 版 design/variations-960x540.html
================================================================================

为什么轮播：一屏只回答一个问题，字号就能整体抬一档。整份 12/13px 全部废除，
下限提到 14px，A 页的百分比从 48px 提到 64px、倒计时从 12px 提到 18px。
代价是「扫一眼时想看的不在屏上」，所以三条必须同时成立：总览页回归得足够快
（A 占一轮 22s 里的 10s）、事件能打断轮播（立刻跳 C 停 20s）、任何时刻看得出
当前是第几页（右下角三点）。

三个原变体不再互相竞争，各自成为一页 —— 上一轮「V1 还是 V3」那个取舍在这里消失了：
A 页就是 V1 的内容，B 页就是 V3 的内容，V2 的弧作为 A 页的可选风格（默认关，本版未做）。

PAGES
  A 总览      还剩多少      三块瓦片横排：名 16px · 状态点 · 5h % 64px · 倒计时 18px
                            7d 不显示。ZCode 的 Key 已进 Keychain，静止态是真实额度
                            （5h 61%）；「未连接」退成 empty 态的一种
  B 额度详情  够不够撑到重置 三条竖向时间带：名 · 判语 14px · 5h % 20px · 7d % 16px
                            带高 12px · 「现在」游标 · 右端重置刻度 · 倒计时
  C 事件      谁刚做完      最新 1 放大（标题 20px 单行）+ 3 行 16px；无计数文字
  attention   谁在等我      整屏专用页：agent · 「等待你」28px · 说明 18px · 等了多久

STATES —— 7 种状态仍然完整，每一页都要能渲染它们
  populated / loading / empty / error / edge / attention / running

节奏（tokens：--dwell-a/b/c/event）—— 实机反馈 1 后改为慢轮播
  A 60s → B 60s → C 60s → A …（一轮 3 分钟）
  「空闲加速」已作废：慢轮播之后回归不靠频率，靠打断
  切页：横向滑动 300ms --ease-standard；reduced-motion 下直接切换，无动画

打断（优先级从高到低）
  1 attention  专用整屏页接管，轮播暂停，直到该状态消失（ack 或再点一次「模拟等待批准」）
  2 新事件     立刻切到 C 页并停满一个 dwell（60s），新行从顶部推入，
               期间再来一条重新计时，提示音一次
  3 running    不打断，只在 A 页状态点脉冲、C 页顶部一行「进行中」
  打断结束后从 A 页恢复

纯净模式（副屏上还原最终效果）
  ?pure=1 或按 P 进入：控制栏与说明全部隐藏，body 背景就是 --canvas，画布居中铺满视口，
  同时请求 Fullscreen。?pure=1 打开时先挂一行 14px「按任意键进入全屏」——Fullscreen API
  必须由用户手势触发。Esc 或再按 P 退出回调试视图。
  纯净模式下轮播强制开、忽略 localStorage 的手动选页；键盘 ack 与指示点保留。

手动切换
  ← / → 切上一页 / 下一页，↑ 或 Home 回 A；点击右下角指示点直接跳页（热区 24×24，
  视觉仍 4px）；点击画布左右各 15% 的边缘区切页——无常驻控件，鼠标移入才浮出 24px
  monoline chevron，2s 无移动即隐藏。
  手动切页后轮播暂停 --manual-hold（120s），指示点左侧挂一个 14px 的「‖」；
  120s 无操作从当前页继续。打断优先级不变：期间来了新事件仍跳 C 并重新计时，
  attention 仍接管整屏。attention 页不能被手动切走（它需要被处理），但可以 Enter ack。
  纯净模式下以上全部可用。

INTERACTION
  点击 / Enter / Space 事件行 = ack（attention 行 ack 即解除接管）
  控制栏：页切换 / 自动轮播开关 / 7 状态 / 模拟新事件 / 模拟等待批准 / reduced-motion
         + 当前页与剩余秒数（工具，不进画布）
  localStorage 记住轮播开关与手动选中的页

/* ==========================================================================
   design/tokens.css —— 内联副本（由构建步骤逐字拼入，不手工同步）
   ========================================================================== */
/* =============================================================================
   Agent Monitor — design tokens
   Layer 1  extracted verbatim from DESIGN.md (raycast) via design-system-extract
   Layer 2  project layer for the 960×540 @2x secondary display
   Naming is by PURPOSE, not by hue. Findings are at the bottom of this file.
   ========================================================================== */

:root {
  /* ==========================================================================
     1 · SURFACE LADDER — extracted (DESIGN.md › Colors › Surface)
     Elevation in this system is a background-color ladder, never a shadow.
     Each notch lighter reads as one step closer to the viewer.
     ====================================================================== */
  --canvas:            #07080a;  /* page ground, the dominant surface        */
  --surface:           #0d0d0d;  /* card / panel — one notch above canvas    */
  --surface-elevated:  #101111;  /* input fill, inactive track, active chip  */
  --surface-card:      #121212;  /* top notch — unread row, keycap, hover    */

  /* ==========================================================================
     2 · HAIRLINES — extracted (DESIGN.md › Elevation & Depth)
     ====================================================================== */
  --hairline:          #242728;               /* universal 1px card edge     */
  --hairline-soft:     rgba(255,255,255,.08); /* over-image / translucent    */
  --hairline-strong:   rgba(255,255,255,.16); /* stronger inline divider     */

  /* ==========================================================================
     3 · TEXT — extracted (DESIGN.md › Colors › Text)
     Contrast measured against --surface #0d0d0d (worst realistic case here):
       ink 17.69:1 · charcoal 12.99:1 · body 12.23:1 · mute 7.09:1
       ash 3.64:1  · stone 1.97:1
     ====================================================================== */
  --ink:               #f4f4f6;  /* headline / primary numerals             */
  --charcoal:          #d3d3d4;  /* body where ink reads too soft           */
  --body:              #cdcdcd;  /* default running text, bar fills         */
  --mute:              #9c9c9d;  /* metadata, labels, timestamps  (≥12px ok)*/
  --ash:               #6a6b6c;  /* 3.64:1 — NON-INFORMATIONAL MARKS ONLY   */
  --stone:             #434345;  /* 1.97:1 — never text; inactive track only*/

  /* ==========================================================================
     4 · SEMANTIC — extracted (DESIGN.md › Colors › Semantic)
     raycast scopes these to illustrations; this project promotes them to
     quota thresholds only (see §7). They are NOT accent.
     ====================================================================== */
  --ok:                #59d499;
  --warn:              #ffc533;
  --danger:            #ff6161;
  --info:              #57c1ff;
  --ok-soft:           rgba(89,212,153,.15);
  --warn-soft:         rgba(255,197,51,.15);
  --danger-soft:       rgba(255,97,97,.15);

  /* ==========================================================================
     5 · ACCENT — extracted (DESIGN.md: "white IS the brand action")
     The only true accent in the system. In this project it is rationed to
     「未读 / 需要你」 and capped at 2 visible uses per screen.
     ====================================================================== */
  --accent:            #f4f4f6;
  --accent-dim:        rgba(244,244,246,.55);  /* aged unread — see §7       */

  /* ==========================================================================
     6 · RADIUS + SPACING — extracted (DESIGN.md › Shapes / Layout)
     ====================================================================== */
  --r-xs: 4px;  --r-sm: 6px;  --r-md: 8px;  --r-lg: 10px;  --r-full: 9999px;

  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px;  --sp-md: 12px;
  --sp-lg: 16px; --sp-xl: 24px; --sp-xxl: 32px;

  /* SPACING EXCEPTIONS — 第三次重写（R5-05）。前两版都与实现失配，所以这次不再
     手写清单，而是把它做成断言：design/verify.mjs 每格都会扫描 stage 内全部计算出的
     gap / rowGap / columnGap / padding* / margin*，凡不落在上面这条标度上的一律报错。
     **当前实测集合为空**——轮播版里没有任何 off-scale 的间距。
     当前唯一登记的例外：
       · .dots button { padding-bottom: 6px }  —— v2 第 6 条明写「指示点离画布底约 6px」，
         而热区要保持 24×24，只能靠按钮内的下内边距把 4px 的点压到底部。

     两条随之而来的纪律：
       · 不用 margin:auto 做分布。getComputedStyle 会把它解析成一个巨大的 used value
         （实测 371.58px），在这条断言里读起来像野值；改用显式的 grid-column。
       · --dot 6px / --quota-notch-w 2px / caret 2px 是**尺寸**不是间距，不在扫描范围内，
         它们的理由写在 §12 各自的 token 注释里。
     清单要是再和实现对不上，那是断言坏了，不是清单旧了。 */

  /* ==========================================================================
     7 · PROJECT · IDENTITY COLORS  (added — DESIGN.md has no multi-brand slot)
     Categorical, not accent. Allowed on badges, dots and the V2 progress arc.
     Never on a fill wider than the arc stroke.
     ZCode is 智谱 #3b6cff re-plotted in OKLCH at Claude's exact L and C so no
     agent out-shouts another:  L .6724  C .1308  H 265.6  →  #6f93e6
     Measured on --surface: claude 6.23:1 · zcode 6.47:1 · codex 12.99:1

     REVISION 1 (lead, post-review · R1-01 / R1-03 / R2-11): Codex was #f4f4f6,
     the same hex as --accent, so every Codex dot counted as a visual accent and
     the attention state showed three equal-brightness white marks. Demoted to
     --charcoal, still neutral-white, half a step below accent. This also gives
     --charcoal a job (it was the one extracted-but-unused token, R1-08).
     ====================================================================== */
  --id-codex:          var(--charcoal);   /* #d3d3d4 */
  --id-claude:         #d97757;
  --id-zcode:          #6f93e6;

  /* ==========================================================================
     8 · PROJECT · QUOTA THRESHOLDS (added)
     ====================================================================== */
  --quota-normal:      var(--body);
  --quota-warn:        var(--warn);   /* ≥80% */
  --quota-danger:      var(--danger); /* ≥95% */
  /* REVISION 2 (lead, post-review · R1-02 / R2-01 / R2-08): every track-shaped
     graphic (V1 bar track, V2 gauge arc track, V3 band track, V3 timeline nodes)
     moves to --ash. --hairline measured 1.29:1 and --stone 1.97:1 against
     --surface; WCAG 1.4.11 puts a hard 3:1 floor on non-text UI components that
     carry information, and a track carries "how long is the whole thing".
     --ash is 3.64:1 on --surface and 3.75:1 on --canvas. The fills that ride on
     these tracks move to --ink so the fill edge keeps a 4.86:1 boundary. */
  --quota-track:       var(--ash);
  /* REVISION 4 (R3-03 / R4-03): the fill was --ink — the same hex as --accent.
     Measured in V3's populated state the two fills covered 1768 px² while the
     unread dot covered 25 px²: a 70:1 ratio, i.e. the brightest, largest shape
     on the screen was quota, not "someone needs you". Accent only works because
     it is scarce. Demoted to --charcoal: 3.57:1 against the --ash track, still
     over the 3:1 floor, and half a step below accent — the same move Q1 made on
     --id-codex, so the system stays self-consistent. */
  --quota-fill:        var(--charcoal);
  /* REVISION 4 (R3-01 / R3-02 / R4-02 / R4-04): every fill now ends in a 2px
     --canvas notch, the same mechanism as V3's "now" caret. Raising the track to
     --ash fixed track-vs-background but broke fill-vs-track in the danger tier
     (--danger on --ash measured 1.81:1). Colour cannot carry that boundary
     across three semantic tiers, so shape does: the notch measures 18.24:1 on
     ink, 13.39 on charcoal, 12.68 on warn, 6.81 on danger and 3.75 on the bare
     track — constant and tier-independent. Semantic red/yellow are untouched. */
  --quota-notch:       var(--canvas);
  --quota-notch-w:     2px;
  --quota-warn-at:     80;
  --quota-danger-at:   95;

  /* ==========================================================================
     9 · TYPOGRAPHY FAMILIES
     Inter extracted from DESIGN.md, ss03 mandatory ("without it the chrome
     loses its signature voice"). IBM Plex Mono added for numerals only —
     the single deliberate deviation, justified in 00-designer-notes.md.
     ====================================================================== */
  --font-sans: "Inter", "Inter Fallback", -apple-system, BlinkMacSystemFont,
               "Segoe UI", "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", system-ui, sans-serif;
  --font-num:  "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono",
               Menlo, Consolas, "Liberation Mono", monospace;
  --font-features: "calt" 1, "kern" 1, "liga" 1, "ss03" 1;
  --num-features: "tnum" 1, "zero" 1;   /* tabular figures + slashed zero    */

  /* ==========================================================================
     10 · PROJECT · TYPE SCALE for the 480×270 canvas (zoom 2 → 960×540)
     REVISION 3 (3.5" panel, brief-m0-35.md). The panel measured 3.5 inches,
     not 7: 1920×1080 physical on a 3.5" diagonal is ~629 ppi, so one canvas
     CSS px (= 4×4 physical px after zoom 2) is 0.16 mm — about 0.6× the
     0.26 mm of a px on an ordinary desktop monitor. The user compared 1x /
     1.5x / 2x on the real panel and picked 2x.
     Consequence: the scale is NOT the 960 scale halved. It is re-cut around
     the fact that only the big numeral and one enlarged title are readable
     from a seat 50–60 cm away; everything else is "recognisable at a glance".
     The 960×540 scale is preserved in design/variations-960x540.html.
     Seven steps, all used, 12px hard floor —— 轮播版已由 §14 覆盖到 14px，见下方
     §14；这一段保留的是 3.5 寸单屏版（design/variations-35-single.html）的记录。
     ====================================================================== */
  /* R4-09 — 给之后复用这份 token 的 Electron 渲染层：在 0.16 mm/px 的这块屏上，
     12 / 13 / 14 三档的 modular step 是 1.08×，物理差 0.16 mm ≈ 1 弧分，低于分辨阈，
     **它们是同一个视觉档**。三者的层级区分完全由 --ink / --body / --mute 与位置承担，
     调 1px 字号调不出层级。真正起作用的只有三档：12–14 元数据 / 16–18 标题 /
     44–48 主数字。轮播版按 brief-m0-rotation.md 的新表把下限整体抬到 14px。 */
  --fs-micro:   12px;  /* floor — clock, status label, reason line, verdict  */
  --fs-label:   13px;  /* agent name, empty / error headline                 */
  --fs-unit:    14px;  /* percent sign suffix, second event row              */
  --fs-num-sm:  16px;  /* V3's demoted percentage                            */
  --fs-lead:    18px;  /* latest event title (brief floor is 16px)           */
  --fs-num-v2:  44px;  /* V2 primary numeral, beside the 56px arc           */
  --fs-num:     48px;  /* V1 primary numeral                                 */

  --lh-tight:  1.08;   /* numerals                                           */
  --lh-snug:   1.3;    /* headings, single-line rows                         */
  --lh-normal: 1.5;    /* running text                                       */

  --w-read:    400;
  --w-emph:    500;
  --w-announce:600;

  /* letter-spacing — the ALL-CAPS floor of 0.06em is a hard gate            */
  --tr-caps:   .08em;
  --tr-small:  .01em;  /* 12–13px                                            */
  --tr-body:   0;
  --tr-num:    -.02em; /* 48px numerals need negative tracking               */

  /* ==========================================================================
     11 · PROJECT · MOTION (added — DESIGN.md documents no motion at all)
     Motion is reserved for state change. Everything below is stripped under
     prefers-reduced-motion; only the instant switch survives.
     ====================================================================== */
  --dur-instant:  120ms;  /* hover / press                                   */
  --dur-state:    180ms;  /* state confirmation — the 150ms convergence      */
  --dur-bar:      300ms;  /* quota bar / arc advance                         */
  --dur-event:    360ms;  /* new event push-in (brief ceiling 400ms)         */
  --ease-standard: cubic-bezier(.2, 0, 0, 1);   /* M3 standard, front-loaded */
  --ease-exit:     cubic-bezier(.4, 0, 1, 1);
  --cycle-pulse:   2s;    /* running — agent badge                           */
  --cycle-breathe: 3s;    /* attention — brightness delta ≤8%                */

  /* ==========================================================================
     14 · PROJECT · ROTATION LAYER (brief-m0-rotation.md)
     一屏只回答一个问题，字号就能整体抬一档。这一层覆盖 §10 的下限：
     任何文本 ≥14px（12 / 13px 全部废除，依据 04-verify-hierarchy-35.md 的物理
     可读性推算：0.16 mm/px @ 55 cm 下 12px CJK 落在「认不出」区）。

     ====================================================================== */
  --fs-min:      14px;  /* 硬下限 — 时钟、事件时间、B 页判语、原因句        */
  --fs-body-r:   16px;  /* A 页 agent 名、C 页次级标题、空/错原因句         */
  --fs-cd-a:     18px;  /* A 页倒计时 — 12px 分不清 2h22m 与 2h26m          */
  --fs-num-b:    20px;  /* B 页 5h 百分比                                   */
  --fs-lead-r:   20px;  /* C 页最新事件标题                                 */
  --fs-unit-r:   20px;  /* A 页百分号后缀                                   */
  --fs-attn-lead:28px;  /* attention 页「等待你」（简报底线 24）            */
  --fs-attn-body:18px;  /* attention 页说明句                               */
  --fs-num-a:    64px;  /* A 页 5h 百分比（简报底线 64）                     */

  /* 节奏 —— REVISION 5（用户 2026-09-14 实机反馈：原 10/6/6 s 太快）。
     三页一律 60 s，一轮 3 分钟。原来的设计假设是「靠快速回归 A 页来补偿
     『想看的不在屏上』」，实机否掉了这个假设：在副屏上人是余光扫，不是盯着等，
     页太快反而每一眼都撞在切换动画上。改成慢轮播之后，回归靠的不再是频率而是
     **打断**——新事件与 attention 会主动把该看的推到眼前，定时轮播只负责兜底。
     「空闲加速」也随之作废：既然不靠频率回归，空闲时缩短停留就没有意义了。 */

  --dwell-b:      60s;
  --dwell-c:      60s;
  --dwell-event:  60s;  /* 新事件跳 C 后停满一个 dwell，再来一条重新计时     */
  /* 手动切页后轮播暂停多久（REVISION 6）。120 s 是「看完一页还想再看一会儿」与

     960×640 原生模式下不需要补偿，置 1.0。

  --panel-x: 1.19;

  --heat-1: #2b2c2e;
  --heat-2: #4d4f52;
  --heat-3: #8a8c91;
  --heat-4: var(--charcoal);
  --dur-page:    300ms; /* 横向滑动切页                                     */

  /* ==========================================================================
     12 · PROJECT · GEOMETRY — 480×270 canvas, rendered at zoom 2
     REVISION 3. The canvas is authored at 480×270 and the whole stage carries
     zoom: 2, so it fills the panel's 960×540 logical resolution 1:1 and no
     layout is "shrunk to fit". Screenshots still come out 960×540 @2x.

  --screen-h:   270px;
  --screen-zoom: 2;
  --pad-screen: 8px;
  --gap-tile:   8px;
  --gap-block:  8px;
  --h-topbar:   16px;   /* clock only — the wordmark is cut on this canvas   */
  --h-tile:     137px;  /* V1 / V2 quota tile                                */
  --h-band:     48px;   /* V3 stacked time band                              */
  --h-row-lead: 44px;   /* enlarged latest event (V3 uses 64px, two lines)   */
  --h-row:      32px;   /* second event row — brief floor is 28px            */
  --gauge:      60px;   /* V2 arc, brief range 56–64px                       */
  /* R3-02 / R4-04: the progress arc is 4px wider than the track — 2px per side
     = 0.32 mm ≈ 2 arc-minutes at 55 cm, above the ~1 arc-minute resolution
     limit. The previous 1px total (0.5px/side ≈ 0.5 arc-minutes) was below it,
     so the identity-coloured arc had no usable separation from the track
     (Claude 1.71:1, ZCode 1.78:1 by luminance alone). */

  --arc-track:  4px;    /* gauge track                                       */
  --arc-sweep:  270;    /* degrees, opening faces down                       */
  --dot:        6px;    /* unread / attention mark — R4-16: back to 6px       */

   ========================================================================== */
.page-a .tiles{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap-tile);min-height:0}
.page-a .tile{padding:var(--sp-sm);gap:var(--sp-sm)}
.page-a .tile-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-xs);flex:none;height:20px}
.page-a .tile-name{font-size:var(--fs-body-r)}
.page-a .a-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-md);min-width:0}
.page-a .a-nums{display:flex;align-items:baseline;gap:2px;min-width:0}
.page-a .a-nums .num{font-size:var(--fs-num-a)}
/* R5-11 · 原来三位数降到 48px，低于 A 页 ≥64px 的下限，而「额度用尽」恰恰最该喊出来。
   实测 64px 三位数约 111px < 133px 内宽，放得下——不降档，改藏掉此时冗余的 %。 */
.page-a .a-nums[data-wide="1"] .unit{display:none}
.page-a .a-nums .unit{font-size:var(--fs-unit-r)}
/* 倒计时 18px（R4-06 点名要提上来），状态词 14px —— 两者分档才在 123px 的瓦片
   内宽里放得下，也让「数字」与「说明」不再是同一个视觉层 */
.page-a .tile-foot{flex:none;height:24px;display:flex;align-items:baseline;gap:var(--sp-xs);
  color:var(--mute);white-space:nowrap;overflow:hidden;line-height:1.2}
.page-a .tile-foot .cd{font-size:var(--fs-cd-a);font-weight:var(--w-emph)}
.page-a .tile-foot .word{font-size:var(--fs-min)}
.page-a .tile-foot svg{align-self:center}
.page-a .tile-foot svg{color:var(--mute);flex:none}
.page-a .tile-foot[data-level="warn"]   svg{color:var(--quota-warn)}
.page-a .tile-foot[data-level="danger"] svg{color:var(--quota-danger)}
.page-a .tile-foot[data-level="warn"]   span,
.page-a .tile-foot[data-level="danger"] span{color:var(--body)}
.page-a .tile-foot[data-status="attention"] svg,
.page-a .tile-foot[data-status="attention"] span{color:var(--ink)}
.page-a .tile-foot:empty{visibility:hidden}
.page-a .verdict-word{font-family:var(--font-sans);font-size:var(--fs-min)}

/* ==========================================================================
   B 页 · 额度详情
   ========================================================================== */
.page-b .bands{flex:1;display:flex;flex-direction:column;gap:var(--sp-md);min-height:0}
.page-b .tile{flex:1;min-height:0;padding:var(--sp-sm) var(--sp-md);gap:var(--sp-sm);justify-content:center}
.page-b .b-head{display:flex;align-items:center;gap:var(--sp-sm);height:22px;flex:none}
/* R3-05 固定列宽让三条判语共享左边缘；R5-08 修正两点：108px 对「Claude Code」
   余量归零（实测需 109px），且 inline-flex 下 text-overflow 对匿名文本项不生效——
   省略号「装了但没通电」。改 min-width:112px + 内层 span 承载省略号。 */
.page-b .b-name{font-size:var(--fs-body-r);font-weight:var(--w-emph);color:var(--ink);
  display:flex;align-items:center;gap:var(--sp-xs);min-width:112px;flex:none;line-height:1}
.page-b .b-name span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.page-b .b-verdict{font-size:var(--fs-min);color:var(--mute);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.page-b .b-verdict[data-tone="error"]{color:var(--danger)}
.page-b .b-verdict[data-tone="attn"]{color:var(--ink);font-weight:var(--w-read)}
.page-b .b-pc{font-size:var(--fs-num-b);font-weight:var(--w-emph);color:var(--ink);flex:none}
.page-b [data-level="warn"]   .b-pc{color:var(--quota-warn)}
.page-b [data-level="danger"] .b-pc{color:var(--quota-danger)}
.page-b .b-sec{font-size:var(--fs-body-r);color:var(--mute);flex:none}
.page-b .b-cd{font-size:var(--fs-min);color:var(--mute);flex:none;width:48px;text-align:right}
.page-b .band{position:relative;height:12px;flex:none;
  background:var(--quota-track);border-radius:var(--r-xs);overflow:hidden}
.page-b .band .used{position:absolute;left:0;top:0;bottom:0;background:var(--quota-fill);
  border-radius:var(--r-xs) 0 0 var(--r-xs);
  box-shadow:var(--quota-notch-w) 0 0 var(--quota-notch);
  transition:width var(--dur-bar) var(--ease-standard)}
.page-b [data-level="warn"]   .band .used{background:var(--quota-warn)}
.page-b [data-level="danger"] .band .used{background:var(--quota-danger)}
/* 「现在」游标：--canvas，对轨道 3.75、对各档填充 6.81–13.39，不随填充色漂移 */
.page-b .band .caret{position:absolute;top:0;bottom:0;width:2px;background:var(--quota-notch);margin-left:-1px}
/* R5-02 · 重置刻度原来是带内一道 --mute 竖线，对 ash 轨道只有 1.95:1，不可辨；
   而且在 97% 那种窗口末期会和「现在」游标挤成一个 4px 的明暗簇（R5-10）。
   改成与游标同源的机制：上下各出头 2px 落到带外的 --surface 上（7.09:1），
   靠位置和出头形状传信息，不靠颜色差，也就再不会与带内的游标争同一段像素。 */
.page-b .bandbox{position:relative;flex:none}
.page-b .band .resettick{display:none}
.page-b .bandbox .resettick{position:absolute;top:-2px;bottom:-2px;right:0;width:2px;
  background:var(--mute);border-radius:1px}
.page-b .b-note{font-size:var(--fs-min);color:var(--body);line-height:1.3;flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ==========================================================================
   C 页 · 事件
   ========================================================================== */
.page-c .feed{flex:1;display:flex;flex-direction:column;gap:var(--sp-xs);min-height:0;overflow:hidden}
.row{appearance:none;-webkit-appearance:none;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:var(--r-sm);
  color:inherit;font:inherit;cursor:pointer;flex:none;position:relative;
  display:grid;align-items:center;column-gap:var(--sp-sm);padding:0 var(--sp-sm);
  grid-template-columns:64px minmax(0,1fr) 88px 14px var(--dot);height:44px;
  transition:background var(--dur-state) var(--ease-standard),border-color var(--dur-state) var(--ease-standard)}

.row.lead{height:52px}
.row.lead .rtitle{font-size:var(--fs-lead-r);font-weight:var(--w-emph);color:var(--ink);line-height:1.15}
.chip{font-size:var(--fs-min);font-weight:var(--w-emph);letter-spacing:var(--tr-caps);
  text-transform:uppercase;color:var(--idc);white-space:nowrap;line-height:1.2}
.attn-tag{display:inline-flex;align-items:center;gap:var(--sp-xs);font-size:var(--fs-min);
  font-weight:var(--w-emph);letter-spacing:var(--tr-small);color:var(--ink);white-space:nowrap;line-height:1}
.rtitle{font-size:var(--fs-body-r);line-height:1.2;color:var(--body);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* 88px 是「9/13 10:36」在 14px IBM Plex Mono 下的实际宽度（10 字符 × 8.4 ≈ 84）。
   加 overflow:hidden 兜底：真实数据里出现更长的时间串时截断，而不是压到图标上。 */
.rtime{font-family:var(--font-num);font-feature-settings:var(--num-features);
  font-variant-numeric:tabular-nums;font-size:var(--fs-min);color:var(--mute);
  white-space:nowrap;text-align:right;line-height:1;min-width:0;overflow:hidden}
.rkind{display:inline-flex;align-items:center;justify-content:center;color:var(--mute)}
.rkind[data-kind="failed"]{color:var(--danger)}
.rkind[data-kind="running"]{color:var(--idc);animation:pulse var(--cycle-pulse) var(--ease-standard) infinite}
.rmark{width:var(--dot);height:var(--dot);border-radius:var(--r-full);background:transparent;justify-self:end}
.row[data-unread="1"]{background:var(--surface)}
.row[data-unread="1"] .rtitle{color:var(--ink);font-weight:var(--w-emph)}
.row[data-unread="1"] .rmark{background:var(--accent)}
.row[data-aged="1"] .rtitle{color:var(--body);font-weight:var(--w-read)}
.row[data-aged="1"] .rmark{background:var(--accent-dim)}
.row[data-kind="attention"]{background:var(--surface-card);border-color:var(--ash)}
.row[data-kind="attention"] .rtitle{color:var(--ink);font-weight:var(--w-emph)}
.row[data-kind="attention"] .rmark{background:var(--accent)}
/* R5-06 · hover 必须排在属性规则之后，否则未读行（surface）与 attention 行
   （surface-card）的背景会把它盖掉，等于这两类行没有 hover 反馈。
   attention 行已经在 surface-card 上，再升一档没有余量，改用 1px --ash 内描边。 */
.row:hover{background:var(--surface-card)}
.row[data-kind="attention"]:hover{box-shadow:inset 0 0 0 1px var(--ash)}
.row:active{background:var(--surface-elevated);box-shadow:inset 0 0 0 1px var(--ash);
  transition-duration:var(--dur-instant)}
.row:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}

.row.enter{animation:enter var(--dur-event) var(--ease-standard) both}
@keyframes enter{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.feed-msg{flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-xs);padding:0 var(--sp-sm)}
.feed-skel{flex:1;display:flex;flex-direction:column;gap:var(--sp-xs)}
.feed-skel i{display:block;height:44px;background:var(--stone);border-radius:var(--r-sm);flex:none}
.feed-skel i:first-child{height:52px}

/* ==========================================================================
   D 页 · 每日用量热力图
   配色决定：不用 GitHub 的绿，也不用 --accent-blue —— 蓝会和 ZCode 的身份色
   #6f93e6 混淆。改用系统里已经在承担「数据」职责的那条中性阶：0 档是
   --surface-elevated，1–4 档沿 --charcoal 方向的中性明度阶。同一色相（中性）、
   无渐变，且顶档就是 --charcoal，与额度填充 --quota-fill 同色，含义一致：
   「这是数据，不是强调」。格子不按 agent 分色，只按总量分档。
   ========================================================================== */
.page-d .dwrap{flex:1;display:flex;flex-direction:column;gap:var(--sp-sm);min-height:0}
.page-d .d-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-sm);flex:none;height:20px}
.page-d .d-title{font-size:var(--fs-body-r);font-weight:var(--w-emph);color:var(--ink);
  white-space:nowrap;line-height:1}
.page-d .d-legend{display:flex;align-items:center;gap:var(--sp-md);
  font-size:var(--fs-min);color:var(--mute);line-height:1}
.page-d .d-legend span{display:inline-flex;align-items:center;gap:var(--sp-xs);white-space:nowrap}
.page-d .d-legend i{width:var(--dot);height:var(--dot);border-radius:var(--r-full);background:var(--idc)}
/* 数据只有 8 周时格子占不满 464px。左对齐会读成「右边那片是不是没加载出来」，
   所以整块居中——列数少是数据的事实，不该让版面看起来像坏了。 */
.page-d .d-grid{display:flex;gap:var(--sp-sm);flex:1;min-height:0;
  align-items:center;justify-content:center}
.page-d .d-days{display:grid;grid-auto-rows:var(--cell);row-gap:2px;flex:none;width:26px;
  font-size:var(--fs-min);color:var(--mute)}
.page-d .d-days span{line-height:var(--cell)}
.page-d .d-cells{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cell));gap:2px;flex:none}
.page-d .cell{width:var(--cell);height:var(--cell);border-radius:2px;border:0;padding:0;
  background:var(--heat-0);cursor:default}
.page-d .cell[data-l="1"]{background:var(--heat-1)}
.page-d .cell[data-l="2"]{background:var(--heat-2)}
.page-d .cell[data-l="3"]{background:var(--heat-3)}
.page-d .cell[data-l="4"]{background:var(--heat-4)}
.page-d .cell[data-void="1"]{background:transparent}
.page-d .cell:focus-visible{outline:none;box-shadow:0 0 0 2px var(--accent)}
.page-d .d-tip{flex:none;height:20px;font-size:var(--fs-min);color:var(--body);line-height:20px;
  display:flex;align-items:center;justify-content:flex-start;gap:var(--sp-sm);overflow:hidden;white-space:nowrap}
.page-d .d-tip b{font-weight:var(--w-emph);color:var(--ink)}
.page-d .d-tip .dim{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.page-d .d-scale{display:flex;align-items:center;gap:var(--sp-xs);flex:none;margin-inline-start:var(--sp-sm)}
.page-d .d-scale i{width:8px;height:8px;border-radius:2px;display:block}

/* ==========================================================================
   E 页 · 今日 AI 大事（AIHOT）—— 这一页是阅读不是扫视，五条等权
   ========================================================================== */
.page-e .ewrap{flex:1;display:flex;flex-direction:column;gap:var(--sp-sm);min-height:0}
.page-e .e-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-sm);flex:none;height:20px}
.page-e .e-title{font-size:var(--fs-body-r);font-weight:var(--w-emph);color:var(--ink);white-space:nowrap;line-height:1}
.page-e .e-upd{font-family:var(--font-num);font-variant-numeric:tabular-nums;
  font-size:var(--fs-min);color:var(--mute);white-space:nowrap;line-height:1}
.page-e .e-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--sp-xs);overflow:hidden}
/* 第三列写成 minmax(0,34%) 而不是 auto：auto 列按 max-content 定宽，
   遇到超长来源名会把整个网格撑出画布（403 宽下必现，edge 态更明显）。 */
.page-e .e-item{flex:1;min-height:0;display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,34%);
  column-gap:var(--sp-sm);align-items:center}
.page-e .e-no{font-family:var(--font-num);font-feature-settings:var(--num-features);
  font-variant-numeric:tabular-nums;font-size:var(--fs-min);color:var(--mute);text-align:right;line-height:1}
.page-e .e-t{font-size:var(--fs-body-r);line-height:1.2;color:var(--ink);text-wrap:balance;
  display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:var(--e-lines)}
/* 一个可裁切的格子里放「可变长的来源」+「必须出现的时间」，被裁掉的一定是后者——
   实机上三条真实 AIHOT 来源名都够长，省略号全落在来源里，时间一条都没渲染出来。
   改成 flex：时间 flex:none 永不收缩，来源才是被省略的那一半。
   顺序仍按简报的「来源 · 时间」，时间因此天然右对齐成一列。 */
.page-e .e-meta{font-size:var(--fs-min);color:var(--mute);line-height:1.2;min-width:0;
  display:flex;align-items:baseline;justify-content:flex-end;gap:var(--sp-xs)}
.page-e .e-src{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-e .e-time{flex:none;white-space:nowrap}
.page-e .e-foot{flex:none;height:18px;font-size:var(--fs-min);color:var(--mute);line-height:18px}

/* ==========================================================================
   attention 页 · 整屏只为这一件事
   ========================================================================== */
.page-attn{justify-content:center}
.attn-card{background:var(--surface-card);border:1px solid var(--ash);border-radius:var(--r-md);
  padding:var(--sp-lg);display:flex;flex-direction:column;gap:var(--sp-md);position:relative}
.attn-who{display:inline-flex;align-items:center;gap:var(--sp-sm);font-size:var(--fs-body-r);
  font-weight:var(--w-emph);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--idc);line-height:1}
.attn-who::before{content:"";width:var(--dot);height:var(--dot);border-radius:var(--r-full);background:var(--idc)}
/* R5-20 · accent 的定义是「未读 / 需要你」，而这一页就是「需要你」本身，
   原来却是全屏 0 处 accent。用与未读点同一套词汇（6px 圆点）在卡片右上兑现一次，
   身份仍由左侧的身份色点 + 大写徽记承担。做成真实元素而不是伪元素——
   伪元素躲得过 accent 全量扫描，那这处 accent 在断言里就是隐形的。 */
.attn-dot{position:absolute;top:var(--sp-md);right:var(--sp-md);
  width:var(--dot);height:var(--dot);border-radius:var(--r-full);background:var(--accent)}
.attn-lead{display:flex;align-items:center;gap:var(--sp-sm);font-size:var(--fs-attn-lead);
  font-weight:var(--w-announce);color:var(--ink);line-height:1.1}
.attn-lead svg{flex:none}
.attn-what{font-size:var(--fs-attn-body);line-height:1.35;color:var(--body);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attn-meta{font-size:var(--fs-min);color:var(--mute);display:flex;gap:var(--sp-sm);align-items:baseline}
.attn-meta .mono{font-size:var(--fs-min)}

/* ==========================================================================
   REDUCED MOTION —— 媒体查询与控制栏开关，任一生效即全停（含切页动画）
   ========================================================================== */
@media (prefers-reduced-motion:reduce){
  .stage *,.stage *::before,.stage *::after{animation:none!important;transition:none!important}
  .page{transform:none!important}
}
html[data-rm="1"] .stage *,
html[data-rm="1"] .stage *::before,
html[data-rm="1"] .stage *::after{animation:none!important;transition:none!important}
html[data-rm="1"] .page{transform:none!important}
</style>
</head>

<body>

<div class="harness">
  <div class="hgroup"><b>页</b>
    <div class="seg" id="segPage" role="group" aria-label="切换页">
      <button type="button" data-p="a" aria-pressed="true">A 总览</button>
      <button type="button" data-p="b" aria-pressed="false">B 额度</button>
      <button type="button" data-p="c1" aria-pressed="false">C1 session</button>
      <button type="button" data-p="c2" aria-pressed="false">C2</button>
      <button type="button" data-p="d" aria-pressed="false">D 用量</button>
      <button type="button" data-p="e" aria-pressed="false">E 今日 AI</button>
      <button type="button" data-p="attn" aria-pressed="false">attention</button>
    </div>
  </div>
  <div class="hgroup">
    <label class="hcheck"><input type="checkbox" id="chkRotate" checked> 自动轮播</label>
    <span class="hmeter" id="meter">A · 10.0s</span>
  </div>
  <div class="hgroup"><b>状态</b>
    <div class="seg" id="segState" role="group" aria-label="切换状态">
      <button type="button" data-s="populated" aria-pressed="true">populated</button>
      <button type="button" data-s="loading"   aria-pressed="false">loading</button>
      <button type="button" data-s="empty"     aria-pressed="false">empty</button>
      <button type="button" data-s="error"     aria-pressed="false">error</button>
      <button type="button" data-s="edge"      aria-pressed="false">edge</button>
      <button type="button" data-s="attention" aria-pressed="false">attention</button>
      <button type="button" data-s="running"   aria-pressed="false">running</button>
    </div>
  </div>
  <div class="hgroup"><b>画布</b>
    <div class="seg" id="segH" role="group" aria-label="画布高度">
      <button type="button" data-h="270" aria-pressed="true">480×270</button>
      <button type="button" data-h="320" aria-pressed="false">480×320</button>
    </div>
    <label class="hcheck">panel-x
      <input type="range" id="rngPanel" min="1" max="1.25" step="0.01" style="width:110px">
      <span id="panelVal" style="font:12px/1 ui-monospace,monospace;min-width:34px">1.19</span>
    </label>
  </div>
  <div class="hgroup">
    <button type="button" class="hbtn" id="btnPure">纯净全屏</button>
    <button type="button" class="hbtn" id="btnPush">模拟新事件</button>
    <button type="button" class="hbtn" id="btnAttn">模拟等待批准</button>
    <label class="hcheck"><input type="checkbox" id="chkRm"> reduced-motion</label>
  </div>
</div>

<p class="pure-hint" id="pureHint" hidden>按任意键进入全屏</p>
<div class="panel-flash" id="panelFlash" hidden></div>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="screen">
      <h1 class="sr">Agent Monitor 副屏面板</h1>
      <div class="topbar">
        <span class="loading-label" id="topLoading" hidden>读取中</span>
        <span class="tb-right"><span class="clock" id="clock" data-clock>16:32</span><span class="unread" id="unread"></span></span>
      </div>
      <div class="pages" id="pages">

/* v2 · 行上的时间是「最后更新时间」（最后一条消息 / 最后一次状态变化），不是开始时间。
   completed / failed 的 at 本来就是完成时刻；running 没完成，它的最后更新随消息推进，
   所以单独给一个会走的时间戳——屏上从「刚刚」开始往后爬。
   排序：running 最前，其余按最后更新倒序。 */
const lastUpdateOf = it => it.lastUpdate || it.at;
function sortSessions(items){
  return [...items].sort((x, y) => {
    const rx = x.kind === "running" ? 1 : 0, ry = y.kind === "running" ? 1 : 0;
    if (rx !== ry) return ry - rx;
    return new Date(lastUpdateOf(y)) - new Date(lastUpdateOf(x));
  });
}

/* 三个值现在都有真实出处（m3-executor 在本机取到）：Codex 从 turn_context.payload.model、

const TOP_MODEL = {codex:"gpt-6-astra", claude:"Opus 5", zcode:"GLM-5.3-Flash"};
const topModel = id => TOP_MODEL[id] || "—";

/* ---------- 渲染：C 页 ---------- */
function rowHTML(it, isLead, aged){
  const a = AGENTS[it.agent];
  const icon = it.kind === "failed" ? "alert" : it.kind === "attention" ? "ret"
             : it.kind === "running" ? "dot" : "check";
  /* v2 · 时间一律是「最后更新时间」，running 也是——它随消息推进，所以会逐秒往后爬 */
  const lu = lastUpdateOf(it);
  const timeAttr = `data-when="${esc(lu)}"`;
  const when = whenFmt(lu, now());
  const label = `${a.name} · ${KIND_LABEL[it.kind] || KIND_LABEL.completed} · ${it.title} · ${when}` +
                (it.unread ? " · 未读，按 Enter 标记已读" : "");
  const first = it.kind === "attention"
    ? `<span class="attn-tag">${svg("ret",13)}等待你</span>`
    : `<span class="chip">${esc(a.tag)}</span>`;
  return `<button type="button" class="row${isLead ? " lead" : ""}" data-id="${esc(it.id)}" ` +
    `data-kind="${it.kind}" data-unread="${it.unread ? 1 : 0}" data-aged="${aged ? 1 : 0}" ` +
    `style="--idc:${a.color}" aria-label="${esc(label)}">` +
    first + `<span class="rtitle">${esc(it.title)}</span>` +
    `<span class="rtime" ${timeAttr}></span>` +
    `<span class="rkind" data-kind="${it.kind}">${svg(icon,14)}</span>` +
    `<span class="rmark"></span></button>`;
}
/* v2 · C 拆成 C1 / C2，每页 4 行。放大的那一条只在 C1 的首位——它是「最新的一件事」，
   C2 是溢出页，四行等权。 */
function renderPageC(){
  const f = scene.feed;
  el.feedTitle.textContent = FEED_TITLE[state] || "最近的 session";
  const skel = `<div class="feed-skel"><i></i><i></i><i></i><i></i>
      <span class="loading-label sr" role="status">读取中</span></div>`;
  const msg = f.phase === "msg" ? `<div class="feed-msg msg" data-tone="${f.msg.tone}">
      <div class="msg-head">${svg(f.msg.icon,15)}<span>${esc(f.msg.title)}</span></div>
      <p>${esc(f.msg.why)}</p></div>` : "";
  if (f.phase === "loading"){ el.pc1Feed.innerHTML = skel; el.pc2Feed.innerHTML = ""; return; }
  if (f.phase === "msg"){ el.pc1Feed.innerHTML = msg; el.pc2Feed.innerHTML = ""; return; }

  const all = sortSessions(f.items);
  const attn = all.some(x => x.kind === "attention");
  let spent = false;
  const paint = (list, withLead) => list.map((it, i) => {
    const full = !spent && (attn ? it.kind === "attention" : it.unread);
    if (full) spent = true;
    return rowHTML(it, withLead && i === 0, it.unread && !full);
  }).join("");
  el.pc1Feed.innerHTML = paint(all.slice(0, PER_PAGE), true);
  el.pc2Feed.innerHTML = paint(all.slice(PER_PAGE, PER_PAGE * 2), false);
  tickFeed();
}

/* ==========================================================================
   D 页 · 每日用量热力图
   ==========================================================================
   usage.json 的 total 是三家数值的裸和，而三家单位不同（Codex / Claude 是 token，
   ZCode 是请求次数），所以 total 作为一个要展示的数字没有意义。分档用 intensity
   （每家各自归一化后取均值，0–1），tooltip 则按各自的真实单位分别报——
   与其编一个「统一的请求次数」，不如如实说三家各是多少。 */
const fmtNum = v => v >= 1e8 ? (v / 1e8).toFixed(1) + "亿"
                  : v >= 1e4 ? (v / 1e4).toFixed(1) + "万" : String(v);
const DAY_LABEL = ["一", "", "三", "", "五", "", "日"];   /* 隔行标，免得 14px 挤成一片 */

function heatLevel(intensity, max){
  if (!intensity) return 0;
  const t = max > 0 ? intensity / max : 0;
  return Math.min(4, 1 + Math.floor(t * 4 - 1e-9));
}
function renderPageD(){
  const st = scene.dataState;
  if (st !== "ok"){
    el.pdHeat.innerHTML = st === "loading"
      ? `<div class="feed-skel"><i style="height:20px"></i><i style="height:104px"></i>
         <span class="loading-label" role="status">读取中</span></div>`
      : `<div class="feed-msg msg" data-tone="${st === "error" ? "error" : "empty"}">
         <div class="msg-head">${svg(st === "error" ? "radio" : "inbox", 15)}<span>${
           st === "error" ? "用量数据读取失败" : "还没有用量数据"}</span></div>
         <p>${st === "error" ? "codexbar cost 调用超时，10 分钟后重试" : "跑满一天后这里会出现第一格"}</p></div>`;
    return;
  }
  const days = USAGE.days || [];
  const maxI = days.reduce((m, d) => Math.max(m, d.intensity || 0), 0);
  /* 列数由画布宽度决定：每列 cell+2px，减去星期标签列与间隙 */
  const cell = 13;
  const avail = el.pdHeat.clientWidth || (screenW() - 16);
  const cols = Math.max(4, Math.min(Math.ceil(days.length / 7), Math.floor((avail - 26 - 8 + 2) / (cell + 2))));
  const shown = days.slice(-cols * 7);
  /* 第一格对齐到周一：JS 的 getDay() 周日是 0 */
  const firstIdx = (new Date(shown[0].date).getDay() + 6) % 7;
  const cellsHtml = Array.from({length: firstIdx}, () =>
      `<span class="cell" data-void="1" aria-hidden="true"></span>`).join("") +
    shown.map(d => {
      const lv = heatLevel(d.intensity, maxI);
      return `<button type="button" class="cell" data-l="${lv}" data-date="${esc(d.date)}" ` +
        `tabindex="-1" aria-label="${esc(d.date)} 用量第 ${lv} 档"></button>`;
    }).join("");
  /* 周数按真实数据跨度报，不按补齐后的列数——补出来的那一格不是一周 */
  const weeks = USAGE.weeks || Math.round(shown.length / 7);
  el.pdHeat.innerHTML = `
    <div class="d-head"><span class="d-title">每日用量 · 近 ${weeks} 周</span>
      <span class="d-legend">${["codex","claude","zcode"].map(id =>
        `<span style="--idc:${AGENTS[id].color}"><i></i>${esc(AGENTS[id].tag)}</span>`).join("")}</span></div>
    <div class="d-grid" style="--cell:${cell}px">
      <div class="d-days">${DAY_LABEL.map(x => `<span>${x}</span>`).join("")}</div>
      <div class="d-cells" id="dCells">${cellsHtml}</div>
    </div>
    <div class="d-tip" id="dTip"></div>`;
  const cells = [...el.pdHeat.querySelectorAll(".cell[data-date]")];
  const byDate = Object.fromEntries(days.map(d => [d.date, d]));
  const tip = el.pdHeat.querySelector("#dTip");
  const showTip = c => {
    const d = byDate[c.dataset.date];
    if (!d) return;
    const b = d.byAgent || {};
    const parts = [];
    if (b.codex)  parts.push(`Codex ${fmtNum(b.codex.tokens || 0)} tok`);
    if (b.claude) parts.push(`Claude ${fmtNum(b.claude.tokens || 0)} tok`);
    if (b.zcode)  parts.push(`ZCode ${fmtNum(b.zcode.requests || 0)} 次`);
    tip.innerHTML = `<b>${esc(d.date)}</b><span class="dim">${esc(parts.join(" · "))}</span>` +
      `<span class="d-scale">${[0,1,2,3,4].map(l =>
        `<i style="background:var(--heat-${l})"></i>`).join("")}</span>`;
    cells.forEach(x => x.tabIndex = x === c ? 0 : -1);
  };
  cells.forEach((c, i) => {
    c.addEventListener("mouseenter", () => showTip(c));
    c.addEventListener("focus", () => showTip(c));
    c.addEventListener("keydown", e => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (!d) return;
      const t = cells[i + d];
      if (t){ t.focus(); e.preventDefault(); e.stopPropagation(); }
    });
  });
  if (cells.length){ cells[cells.length - 1].tabIndex = 0; showTip(cells[cells.length - 1]); }
}

/* ---------- 逐秒增量更新 ---------- */
function tickClocks(){
  const txt = hhmm(new Date(now()));
  document.querySelectorAll("[data-clock]").forEach(n => n.textContent = txt);
}
function tickTiles(){
  const t = now();
  document.querySelectorAll("[data-foot]").forEach(n => {
    const st = n.dataset.status;
    n.textContent = st === "attention" ? "" : countdown(n.dataset.foot, t);
  });
  document.querySelectorAll("[data-word]").forEach(n => {
    const [lv, st] = n.dataset.word.split("|");
    n.textContent =
      st === "attention" ? "等待你批准"
      : lv === "danger"  ? "吃紧"
      : lv === "warn"    ? "偏紧"
      : st === "running" ? "运行中"
      :                    "后重置";
  });
  document.querySelectorAll("[data-cd]").forEach(n => n.textContent = countdown(n.dataset.cd, t));
  document.querySelectorAll("[data-caret]").forEach(n => {
    const pct = Math.max(0, Math.min(100, ((t - Number(n.dataset.caret)) / WIN5H) * 100));
    n.style.left = pct.toFixed(2) + "%";
  });
  /* v2 · 判语整句删掉，原位置改显示当前窗口用得最多的模型名。
     「够不够撑到重置」不丢：它由时间带上填充与「现在」游标的落差承担，
     不再用一句话复述——那句话在 14px 上本来也只是被扫过去而不是被读。 */
  document.querySelectorAll("[data-model]").forEach(n => {
    const st = n.dataset.status;
    if (st === "attention"){ n.dataset.tone = "attn"; n.textContent = "等待你批准"; return; }
    n.dataset.tone = "model";
    n.textContent = st === "running" ? `运行中 · ${n.dataset.model}` : n.dataset.model;
  });
}
function tickFeed(){
  const t = now();
  document.querySelectorAll("[data-when]").forEach(n => n.textContent = whenFmt(n.dataset.when, t));
  document.querySelectorAll("[data-newswhen]").forEach(n => n.textContent = newsWhen(n.dataset.newswhen, t));
  document.querySelectorAll("[data-elapsed]").forEach(n =>
    n.textContent = elapsedFmt(t - new Date(n.dataset.elapsed).getTime()));
  document.querySelectorAll("[data-elapsed2]").forEach(n =>
    n.textContent = "已等 " + elapsedFmt(t - new Date(n.dataset.elapsed2).getTime()));
}

/* ---------- 跨阈值播报 ---------- */
const lastLevel = {};
function announceThresholds(){
  scene.tiles.forEach(t => {
    if (t.phase !== "ok"){ lastLevel[t.agent] = null; return; }
    const w = t.windows[0], lv = level(w.usedPercent), prev = lastLevel[t.agent];
    if (prev && prev !== lv && lv !== "ok")
      el.live.textContent = `${AGENTS[t.agent].name} 5h 额度已达 ${w.usedPercent}%，` +
        (lv === "danger" ? "余量吃紧" : "余量偏紧");
    lastLevel[t.agent] = lv;
  });
}

/* ---------- 轮播 ---------- */
/* 三页一律 --dwell-*（默认 60s）。「空闲加速」已作废：慢轮播之后回归不靠频率，
   靠的是打断——新事件与 attention 会主动把该看的推到眼前。 */
function dwellFor(p){
  if (p === "c1" && eventHold) return cssMs("--dwell-event");
  const d = DWELL();
  return p === "a" ? d.a : p === "b" ? d.b : d.c;
}

function showPage(p, {reset = true} = {}){
  page = p;
  root.dataset.page = p;
  document.querySelectorAll(".page").forEach(n => {
    const on = n.dataset.p === p;
    n.dataset.on = on ? "1" : "0";
    /* R5-01 · inert 是主机制：aria-hidden 只挡无障碍树，挡不住 Tab。
       隐藏页里的事件行原本仍可聚焦，焦点会掉到看不见的地方。 */
    n.inert = !on;
    n.setAttribute("aria-hidden", on ? "false" : "true");
  });
  /* attention 页三点全暗，读作「当前不在轮播的三页里」—— 这本身就是状态信息 */
  renderDots(p);
  el.holdmark.hidden = !(Date.now() < holdUntil);
  if (reset) dwellUntil = Date.now() + dwellFor(p);
  if (holdUntil && Date.now() >= holdUntil) holdUntil = 0;
  syncTopbar();
  syncSegs();
  el.legend.innerHTML = CAPTIONS[p];
}

const PAGE_LABEL = {a:"总览", b:"额度详情", c1:"session", c2:"更早的 session", d:"每日用量", e:"今日 AI"};
function renderDots(p){
  const L = pagesInRotation();                 /* C2 空时它不在列表里，点也就少一个 */
  el.dots.innerHTML = `<span class="holdmark" id="holdmark" data-not-accent hidden>&#8214;</span>` +
    L.map((q, i) => `<button type="button" data-p="${esc(q)}" data-not-accent ` +
      `data-on="${q === p ? 1 : 0}" aria-label="第 ${i + 1} 页 ${esc(PAGE_LABEL[q] || q)}"></button>`).join("");
  el.holdmark = document.getElementById("holdmark");
}

/* 手动切页：暂停轮播 --manual-hold（120s）。打断优先级不变——
   这期间来了新事件仍跳 C 并重新计时，attention 仍接管整屏。 */
function manualTo(p){
  if (attnActive) return;                 /* attention 页不能被手动切走，它需要被处理 */
  holdUntil = Date.now() + cssMs("--manual-hold");
  showPage(p);
}
function stepPage(d){
  if (attnActive) return;
  const i = pagesInRotation().indexOf(page);
  const L = pagesInRotation();
  manualTo(L[((i < 0 ? 0 : i) + d + L.length) % L.length]);
}

function rotateTick(){
  if (!rotate) return;
  if (Date.now() < holdUntil) return;      /* 手动暂停中 */
  /* R5-13 · attention 接管期间原本 100ms 内就把手动选择抢回 attn，
     评审者没法用控制栏核对其它页。给手动切页 10s 宽限（工具层，不进画布）。 */
  if (attnActive){ if (Date.now() > manualHold) showPage("attn", {reset:false}); return; }
  if (Date.now() < dwellUntil) return;
  if (page === "c1" && eventHold) eventHold = false;  /* 新事件钉住到期 */
  const L = pagesInRotation();
  const i = L.indexOf(page);
  showPage(L[(i < 0 ? 0 : i + 1) % L.length]);
}

function updateMeter(){
  const left = Math.max(0, dwellUntil - Date.now()) / 1000;
  const leftTxt = left >= 10 ? Math.ceil(left) : left.toFixed(1);
  const held = Math.max(0, holdUntil - Date.now()) / 1000;
  el.holdmark.hidden = !(held > 0);        /* 每 100ms 刷一次，到期自己消失 */
  const tag = attnActive ? "attention 接管 · 轮播暂停"
            : held > 0    ? `${page.toUpperCase()} · 手动暂停 ${Math.ceil(held)}s`
            : !rotate     ? "轮播关闭"
            : page === "attn" ? "attention"
            : `${page.toUpperCase()}${eventHold && page === "c" ? " · 新事件钉住" : ""} · ${leftTxt}s`;
  el.meter.textContent = tag;
}

/* R5-07 · 轮播之后 A / B / C 是三个不同的时刻，把唯一那处可见的「读取中」放在 C 页
   等于 A / B 的 loading 态一个字都没有。挪到顶栏：它对三页都在，且不占瓦片预算。
   R3-16 · 未读数同槽，只在 A / B 页且 >0 时出现。 */
function syncTopbar(){
  el.topLoading.hidden = state !== "loading";
  const items = scene && scene.feed.items ? scene.feed.items : [];
  const unread = items.filter(x => x.unread).length;
  el.unread.textContent = (unread > 0 && (page === "a" || page === "b")) ? `· ${unread}` : "";
}

/* ---------- 渲染入口 ---------- */
function render(){
  scene = SCENES[state]();
  /* D / E 两页的数据是独立来源，但要跟着控制栏的七态一起演示 */
  scene.dataState = ({loading:"loading", empty:"empty", error:"error", edge:"edge"})[state] || "ok";
  root.dataset.state = state;
  attnActive = !!attnItem();
  renderPageA(); renderPageB(); renderPageC(); renderPageD(); renderPageE(); renderPageAttn();
  tickTiles(); tickFeed(); tickClocks();
  announceThresholds();
  if (state === "loading") el.live.textContent = "正在读取三个 agent 的额度与事件";
  if (attnActive && rotate) showPage("attn", {reset:false});
  else showPage(page === "attn" && !attnActive ? "a" : page);
  syncTopbar();
}

/* ---------- 提示音 ---------- */
let ac = null;
function chime(){
  if (rm === "1") return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const t = ac.currentTime, g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.055, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    g.connect(ac.destination);
    [[784,1],[1174.7,.5]].forEach(([f,m]) => {
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(f, t);
      og.gain.setValueAtTime(m, t); o.connect(og); og.connect(g); o.start(t); o.stop(t + 0.2);
    });
  }catch(e){}
}

/* ---------- 打断 2 · 新事件 ---------- */
const POOL = [
  {agent:"codex",  title:"把 rollout jsonl 的增量解析补上 fixture 回归", summary:"新增 6 个解析用例，全部通过"},
  {agent:"claude", title:"给 statusline 包一层 tee，把 rate_limits 落盘", summary:"脚本已就位，settings.json 已备份"},
  {agent:"zcode",  title:"训练集 b4 批次转写完成", summary:"本批 68 条，去重后 64 条入库"},
  {agent:"codex",  title:"核对智谱 quota/limit 的 unit 枚举", summary:"3 = 小时、6 = 周，已确认"},
  {agent:"claude", title:"副屏窗口热插拔迁移的 displays.ts 草稿", summary:"按 label 优先、尺寸次之重新定位"},
];
let seq = 0;
const motionOn = () => rm !== "1" && !matchMedia("(prefers-reduced-motion:reduce)").matches;

function pushEvent(){
  if (!scene.feed.items){ state = "populated"; LS.set("am.state", state); render(); }
  const s = POOL[seq++ % POOL.length];
  const item = {id:"new"+seq+"-"+Date.now(), agent:s.agent, kind:"completed",
    title:s.title, summary:s.summary, at:new Date(now()).toISOString(), unread:true};
  const anim = motionOn(), before = new Map();
  if (anim) el.pc1Feed.querySelectorAll(".row").forEach(r => before.set(r.dataset.id, r.getBoundingClientRect().top));
  scene.feed.items.unshift(item);
  eventHold = true;
  holdUntil = 0;                           /* 打断优先级不变：新事件盖过手动暂停 */
  renderPageC();
  /* 立刻跳到 C 页并停 --dwell-event；期间再来一条会重置这 20s */
  showPage("c1");
  if (anim) el.pc1Feed.querySelectorAll(".row").forEach(r => {
    const prev = before.get(r.dataset.id);
    if (prev == null){ r.classList.add("enter"); return; }
    const d = prev - r.getBoundingClientRect().top;
    if (!d) return;
    r.style.transition = "none"; r.style.transform = `translateY(${d}px)`;
    requestAnimationFrame(() => {
      r.style.transition = "transform var(--dur-event) var(--ease-standard)"; r.style.transform = "";
    });
  });
  chime();
  el.live.textContent = `新事件：${AGENTS[item.agent].name} ${item.title}`;
}

/* ---------- 打断 1 · attention ---------- */
function toggleAttn(){
  if (!scene.feed.items){ state = "populated"; LS.set("am.state", state); render(); }
  const existing = scene.feed.items.findIndex(x => x.kind === "attention");
  if (existing >= 0){                      /* 再点一次 = 解除接管 */
    scene.feed.items.splice(existing, 1);
    attnActive = false; eventHold = false;
    renderPageC(); renderPageAttn();
    showPage("a");
    el.live.textContent = "等待批准已解除";
    return;
  }
  scene.feed.items.unshift({...ATTN_ITEM, id:"attn-" + Date.now(), at:new Date(now()).toISOString()});
  attnActive = true;
  renderPageC(); renderPageAttn();
  showPage("attn", {reset:false});
  chime();
  el.live.textContent = "需要你批准：" + ATTN_ITEM.title;
}

/* ---------- ack ---------- */
[el.pc1Feed, el.pc2Feed].forEach(box => box.addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row || !scene.feed.items) return;
  const it = scene.feed.items.find(x => x.id === row.dataset.id);
  if (!it || !it.unread) return;
  it.unread = false;
  const wasAttn = it.kind === "attention";
  renderPageC(); renderPageAttn();
  if (wasAttn){ attnActive = false; showPage("a"); el.live.textContent = "已批准，轮播恢复"; return; }
  const again = document.querySelector(`.row[data-id="${CSS.escape(it.id)}"]`);
  if (again) again.focus();
  const left = scene.feed.items.filter(x => x.unread).length;
  el.live.textContent = left ? `已标记已读，还剩 ${left} 条未读` : "已全部读完";
}));

/* ---------- 控制栏 ---------- */
function syncSegs(){
  document.querySelectorAll("#segPage button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === page)));
  document.querySelectorAll("#segState button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === state)));
}
document.getElementById("segPage").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  LS.set("am.page", b.dataset.p);
  manualHold = Date.now() + 10000;
  showPage(b.dataset.p);
});
document.getElementById("segState").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state = b.dataset.s; LS.set("am.state", state);
  eventHold = false;
  render();
});
document.getElementById("btnPush").addEventListener("click", pushEvent);
document.getElementById("btnAttn").addEventListener("click", toggleAttn);
const chkRotate = document.getElementById("chkRotate");
chkRotate.addEventListener("change", () => {
  rotate = chkRotate.checked; LS.set("am.rotate", rotate ? "1" : "0");
  root.dataset.rotate = rotate ? "1" : "0";   /* R5-14 · 原来只在初始化写一次，值会变错 */
  if (rotate) dwellUntil = Date.now() + dwellFor(page);
  updateMeter();
});
const chk = document.getElementById("chkRm");
chk.addEventListener("change", () => { rm = chk.checked ? "1" : "0"; root.dataset.rm = rm; LS.set("am.rm", rm); });

/* ==========================================================================
   纯净模式：?pure=1 或按 P 进入 / Esc 或再按 P 退出
   Fullscreen API 必须由用户手势触发，所以 ?pure=1 打开时先挂一行提示，
   按任意键再请求全屏——提示只出现这一次。
   纯净模式下轮播强制开、忽略 localStorage 里的手动选页；键盘 ack 与指示点保留。
   ========================================================================== */
/* ---------- 横向压缩补偿 + 画布高度 ---------- */
const rngPanel = document.getElementById("rngPanel");
const panelVal = document.getElementById("panelVal");
const panelFlash = document.getElementById("panelFlash");
let panelX = parseFloat(LS.get("am.panelx", "")) ||
  parseFloat(getComputedStyle(root).getPropertyValue("--panel-x")) || 1.19;
let screenH = parseInt(LS.get("am.screenh", "270"), 10) || 270;
let flashTimer = 0;

function setPanelX(v, {flash = false} = {}){
  panelX = Math.min(1.25, Math.max(1, Math.round(v * 100) / 100));
  /* 画布逻辑宽 = round(480 / panelX)，再由 transform 横向拉回 960 物理宽 */
  root.style.setProperty("--panel-x", String(panelX));
  root.style.setProperty("--screen-w", Math.round(480 / panelX) + "px");
  rngPanel.value = String(panelX);
  panelVal.textContent = panelX.toFixed(2);
  LS.set("am.panelx", String(panelX));
  if (flash){
    panelFlash.textContent = `panel-x ${panelX.toFixed(2)} · ${Math.round(480 / panelX)}px`;
    panelFlash.hidden = false;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => panelFlash.hidden = true, 1000);
  }
  if (scene) { renderPageD(); renderPageE(); }
}
function setScreenH(h){
  screenH = h;
  root.style.setProperty("--screen-h", h + "px");
  /* E 页标题最多两行 —— 270 的高度里五条等权只放得下一行，320 才够两行 */
  root.style.setProperty("--e-lines", h >= 300 ? "2" : "1");
  LS.set("am.screenh", String(h));
  document.querySelectorAll("#segH button").forEach(b =>
    b.setAttribute("aria-pressed", String(Number(b.dataset.h) === h)));
  if (scene) { renderPageD(); renderPageE(); }
}
rngPanel.addEventListener("input", () => setPanelX(parseFloat(rngPanel.value)));
document.getElementById("segH").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  setScreenH(Number(b.dataset.h));
});

const pureHint = document.getElementById("pureHint");
let pure = false, rotateBeforePure = rotate;

function setPure(on, {fs = true} = {}){
  if (pure === on) return;
  pure = on;
  root.dataset.pure = on ? "1" : "0";
  if (on){
    rotateBeforePure = rotate;
    rotate = true; chkRotate.checked = true; root.dataset.rotate = "1";
    showPage("a");                       /* 忽略 localStorage 的手动选页 */
    if (fs) requestFs();
  } else {
    rotate = rotateBeforePure; chkRotate.checked = rotate;
    root.dataset.rotate = rotate ? "1" : "0";
    pureHint.hidden = true;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  }
  updateMeter();
}
function requestFs(){
  if (document.fullscreenElement) return;
  const el0 = document.documentElement;
  (el0.requestFullscreen ? el0.requestFullscreen() : Promise.reject()).catch(() => {
    /* 被拒绝也不影响纯净模式本身：控制栏已经隐藏，画布已经居中 */
  });
}
/* 用户按 Esc 退出浏览器全屏时，同步退回调试视图 */
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && pure) setPure(false);
});
document.addEventListener("keydown", e => {
  if (pureHint.hidden === false){        /* 等手势的那一刻：任意键都算 */
    pureHint.hidden = true;
    requestFs();
    e.preventDefault();
    return;
  }
  if (pure && (e.key === "[" || e.key === "]")){
    setPanelX(panelX + (e.key === "]" ? 0.02 : -0.02), {flash:true});
    e.preventDefault();
    return;
  }
  if (e.key === "p" || e.key === "P"){
    const t = e.target;
    const typing = t instanceof HTMLElement &&
      (t.isContentEditable || t.tagName === "TEXTAREA" ||
       (t.tagName === "INPUT" && !["checkbox","radio","button","submit"].includes(t.type)));
    if (typing) return;                  /* 只给真正会打字的地方让路 */
    setPure(!pure);
    e.preventDefault();
  } else if (e.key === "Escape" && pure){
    setPure(false);
  }
});
document.getElementById("btnPure").addEventListener("click", () => setPure(true));

/* ---------- 手动切换：键盘 / 指示点 / 边缘热区 ---------- */
document.addEventListener("keydown", e => {
  const t = e.target;
  if (t instanceof HTMLElement &&
      (t.isContentEditable || t.tagName === "TEXTAREA" || t.tagName === "SELECT" ||
       (t.tagName === "INPUT" && !["checkbox","radio","button","submit"].includes(t.type))))
    return;                               /* 只给真正会用方向键的控件让路 */
  if (e.key === "ArrowRight")      { stepPage(1);  e.preventDefault(); }
  else if (e.key === "ArrowLeft")  { stepPage(-1); e.preventDefault(); }
  else if (e.key === "ArrowUp" || e.key === "Home") { manualTo("a"); e.preventDefault(); }
});
el.dots.addEventListener("click", e => {
  const b = e.target.closest("button[data-p]");
  if (b) manualTo(b.dataset.p);
});
const CHEVRON = d => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" ` +
  `stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
  `<path d="${d === "prev" ? "M15 5 8 12l7 7" : "M9 5l7 7-7 7"}"/></svg>`;
let hintTimer = 0;
document.querySelectorAll(".edge").forEach(n => {
  n.innerHTML = CHEVRON(n.dataset.side);
  n.addEventListener("click", () => stepPage(n.dataset.side === "next" ? 1 : -1));
  /* 无常驻控件：鼠标移入才浮出 chevron，2s 无移动即隐藏 */
  const show = () => {
    if (attnActive) return;
    n.dataset.hint = "1";
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => document.querySelectorAll(".edge").forEach(m => m.dataset.hint = "0"), 2000);
  };
  n.addEventListener("mouseenter", show);
  n.addEventListener("mousemove", show);
  n.addEventListener("mouseleave", () => n.dataset.hint = "0");
  n.addEventListener("focus", () => n.dataset.hint = "1");
  n.addEventListener("blur", () => n.dataset.hint = "0");
});

setPanelX(panelX);
setScreenH(screenH);
chk.checked = rm === "1";
chkRotate.checked = rotate;
root.dataset.rm = rm;
root.dataset.rotate = rotate ? "1" : "0";
render();
dwellUntil = Date.now() + dwellFor(page);
if (new URLSearchParams(location.search).get("pure") === "1"){
  setPure(true, {fs:false});             /* 全屏要等手势，先只切视觉 */
  pureHint.hidden = false;
}
setInterval(() => { tickClocks(); tickTiles(); tickFeed(); }, 1000);
setInterval(() => { rotateTick(); updateMeter(); }, 100);
})();
</script>
</body>
</html>
