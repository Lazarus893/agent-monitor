<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Midi · 暹罗形象已接入</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#17191b;color:#d3d3d4;font-family:system-ui}main{max-width:960px;margin:auto}h1{font-size:22px;color:#f4f4f6}p{font-size:14px;line-height:1.7;color:#9c9c9d}button{margin:0 6px 10px 0;border:1px solid #434345;border-radius:6px;padding:9px 12px;background:#242728;color:#d3d3d4;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#e4e4df;color:#17191b}#shot{display:block;width:806px;height:540px;max-width:none;margin:18px auto;image-rendering:pixelated}.scroller{overflow:auto}a{color:#d3d3d4}</style></head><body><main><h1>咖啡（暹罗）与 Midi（虎斑）· 已接入正式页面</h1><p>以下直接来自构建后的 Electron 页面，使用示例数据；两套形象各拍一组，托盘「Midi 形象」里切换。按面板补偿后的比例显示；也可以查看 960×540 输出比例。</p><nav id="skins"><button data-skin="siamese" aria-pressed="true">暹罗</button><button data-skin="tabby" aria-pressed="false">虎斑</button></nav><nav id="states"></nav><button id="mode" aria-pressed="false">查看输出比例</button><div class="scroller"><img id="shot" src="runtime-shots-siamese/idle.png" alt="暹罗形象的正式页面：待机"></div><p>96×96 猫框 · 左侧场景 224×128 · 右侧统计保留。<a href="IMPLEMENTATION.md">实现与验证记录</a></p></main><script>let skin='siamese',cur='idle';document.querySelectorAll('#skins button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#skins button').forEach(n=>n.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');skin=b.dataset.skin;shot.src='runtime-shots-'+skin+'/'+cur+'.png'});const states={idle:'待机',typeL:'左爪打字',typeR:'右爪打字',look:'抬头',blink:'眨眼',ear:'动耳朵',sleep:'睡觉',night:'夜间',untrusted:'未授权',wide:'长数字',reduced:'减少动态效果',handover:'换班（1.5 秒处）',swap:'按钮换班（1.5 秒处）'};for(const [key,label] of Object.entries(states)){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(key==='idle'));b.onclick=()=>{cur=key;document.querySelectorAll('#states button').forEach(n=>n.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');shot.src='runtime-shots-'+skin+'/'+key+'.png';shot.alt=(skin==='siamese'?'暹罗':'虎斑')+'形象的正式页面：'+label};document.getElementById('states').append(b)}document.getElementById('mode').onclick=function(){const on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',String(on));shot.style.width=on?'960px':'806px';this.textContent=on?'恢复面板比例':'查看输出比例'}</script></body></html>
