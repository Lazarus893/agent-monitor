<!--
================================================================================
AGENT MONITOR — M0 高保真变体 · 3.5 寸修订版
画布 480×270 CSS px，整体 zoom:2 铺满 960×540 逻辑分辨率
1 画布 px = 4×4 物理像素 = 0.16 mm（1920×1080 @ 3.5" ≈ 629 ppi）
视觉真源 DESIGN.md (raycast) · token 见 design/tokens.css（下方内联副本逐字相同）
差量简报 design/brief-m0-35.md · 960×540 旧版留存于 design/variations-960x540.html
================================================================================

为什么不是把 960 的版面等比缩小：等比缩小正是用户在实机上觉得字小的原因。
这一版是按「座位 50–60 cm、只有大数字和一行放大标题真正读得清」重新分配预算的，
把内容砍到原来的四分之一，其余元素退成「扫一眼能认」。

SCREENS / STATES —— 一块屏，七种状态，三个变体各自完整支持

  高度预算（254 = 270 − 2×8 边距）
    topbar 16（只剩时钟）+ 8 + 瓦片 137 + 8 + 事件区 85
    V3 例外：瓦片区 3×48 + 2×4 = 152，事件区只留一行放大事件 64

  1 populated   Codex 22% · Claude 18% · ZCode 未连接（只剩「未连接」+ 一行原因）
                事件区 1 条放大未读 + 1 条次新                    → 1 处 accent
  2 loading     三块瓦片 + 事件区静态骨架 + role=status「读取中」  → 0 处
  3 empty       等待首轮采样 / statusline 未写入 / 未连接         → 0 处
  4 error       401 未授权 / 429 限流 / 网络不可达（原因与下一步压成一句）→ 0 处
  5 edge        Codex 97% 且 2 分钟后重置（红）· Claude 82%（黄）
                ZCode 已连接 · 一分钟内 8 条事件只露出最新 2 条    → 1 处
  6 attention   最新事件行本身变成 attention 行，标题前缀「等待你」
                （3.5 寸上不再另起全宽 strip，它会吃掉半个事件区）→ 2 处
  7 running     徽记旁 2s 慢速脉冲 + 事件区首位「正在运行」行      → 1 处

STATE (JS)
  variant / state / reducedMotion  → localStorage am.variant / am.state / am.rm
  items                            → 当前事件数组，每条带 unread 标记
  NOW  冻结在 fixtures 的 generatedAt = 2026-09-14 14:33:21 +08:00，之后按真实秒数递增

INTERACTION —— 副屏上没有任何设置类 UI，配置在托盘菜单里
  · 点击 / Enter / Space 事件行 = ack；「模拟新事件」= FLIP ≤360ms + 提示音 + 未读
  · Tab 走遍事件行，focus = 2px --ink 内描边；:active 有按下反馈
  · reduced-motion 开关与真实媒体查询等效，任一生效即全部关停

================================================================================
三个变体 · 一句话 caption（各自决定砍什么）
================================================================================
  V1 · Ledger  数字优先 —— 48px 百分比 + 12px 次级 7d + 一条 3px 细 bar + 倒计时。
               砍掉了 7d 的独立 bar 和 cwd。三个数字一字排开，认得最快，
               也最没有形状记忆点。
  V2 · Gauge   形状优先 —— 56px 弧内只放倒计时，44px 百分比放弧旁，7d 整个不显示。
               砍得最狠，但远处先看到的是弧的缺口，走近才读数字。
  V3 · Strip   时间优先 —— 三条时间带竖向堆叠，填充与「现在」游标同轴，
               判语压到 12px 但保留；百分比退成 16px 次级，事件区只留一行。
               砍掉了第二条事件，换来三条能看清的时间带。

推荐：**V1**。这是相对 7 寸版的改判——3.5 寸上一条 10px 高的时间带在 50–60 cm 外
基本读不出填充和游标的落差，V3 最值钱的那个机制（够不够撑到重置）退化成了一句 12px
的文字，而那句话 V1 的 tile-foot 也能放（返工 Q3 已经加了「余量吃紧 · 2m」）。
在这个尺寸上，48px 的数字是唯一能从座位上一眼读到的东西，V1 把整块预算押在它上面。
V2 是第二选择：弧的缺口在余光里比数字更容易被注意到，代价是 7d 完全看不见了。
V3 留作参考——如果之后换回大屏，它仍然是信息量最高的那个。

================================================================================
交付前自检（3.5 寸画布重跑）
================================================================================
六条产品原则（PLAN.md §3.3）
  [x] 主要任务想清了吗 —— 两个问题：还剩多少额度、谁刚做完 / 谁在等我。这一版按
      3.5 寸重新砍过：凡是「知道了也不会马上行动」的元素全部下线（cwd、未读计数、
      「另 N 条更早」、事件流表头、品牌字、ZCode 的「怎么接」）。
  [x] 砍到只剩一个元素是什么 —— 48px 的 5h 百分比。这也是推荐从 V3 改判到 V1 的理由。
  [x] 哪里的品味非它不可 —— IBM Plex Mono 的 tabular 面（0.16 mm/px 下数字仍不抖），
      以及三个 agent 在 OKLCH 同明度同色度上校过的身份色。
  [x] 80 分了吗 —— 到了。剩下的不确定项只有实机观感本身（见笔记「没验证的」）。
  [x] 用户第一眼感受 —— 静止态「都还好」；attention 时「有人在等我」。
  [x] 一致性 —— 三块瓦片同结构同顺序；事件行同一行模型；五态在三块瓦片上长得一样。

state-coverage
  [x] 五态 × 3 瓦片 + 事件区，加 attention / running 共 7 态 × 3 变体 = 21 个组合，
      全部可由控制栏切到，Playwright 逐个断言。
  [x] error 三种文案不同，原因与下一步压成一句（3.5 寸预算）。
  [x] edge：64 字标题用省略号单行截断、97% + 2 分钟重置、一分钟 8 条只露最新 2 条。
      「超长 cwd」这条边界在本画布上不再适用——cwd 已被内容预算砍掉，笔记里写明。

color / typography
  [x] accent ≤2：实测 populated / edge / running 各 1、attention 2、其余 0。
  [x] Codex 身份色 --charcoal #d3d3d4，不再与 accent 同 hex（返工 Q1）。
  [x] 轨道 ≥3:1：V1 bar 轨 / V2 仪表弧轨 / V3 时间带轨全部 --ash 3.64:1（返工 B1）。
      填充用 --ink，与轨道之间仍有 4.86:1；V2 进度弧比轨道宽 1px 补形状差。
  [x] ALL CAPS 一律 .08em；中文标签用 --tr-small（返工 Q6）。
  [x] 最小 12px；agent 名 13px；最新事件标题 18px（简报底线 16）；主数字 V1 48px /
      V2 44px（简报底线 44）。V3 的 16px 是它轴定义里的「次级」，沿用 lead 已接受的取舍。
  [x] 行高：放大行 44px（V3 64px）、次行 32px，均 ≥28px 底线。
  [x] 数字全部 tabular-nums + tnum/zero。

语义与无障碍（返工 B2 / B3 / B4 / P2 全部沿用）
  [x] heading ≥5：h1「Agent Monitor」sr-only（品牌字在 3.5 寸上被砍，但文档大纲要留）、
      三块瓦片名 h2 可见、事件区标题 h2 sr-only。
  [x] loading 四处「读取中」带 role="status"，并向 #live 推一条。
  [x] 事件行 aria-label 拼入 kind：「Codex · 运行中 · 标题 · 4m23s」。
  [x] 额度跨过 80 / 95 阈值时 #live 播报一次。
  [x] 时钟在任何变体任何状态下都可见（本版不再隐藏 topbar，Q2 天然成立）。
  [x] 交互五态：default / hover / active(--dur-instant) / focus-visible(2px ink) / n-a。

动效
  [x] 只用于状态变化；呼吸用 opacity 叠层而非 filter:brightness（返工 P3）。
  [x] prefers-reduced-motion 与控制栏开关任一生效即全部关停。

禁用项
  [x] 无 emoji / 无 gradient / 无靛蓝 / 无 #000·#fff 大面积 / 无左侧色条 / 无投影。

间距
  [x] 全部落在 2/4/8/12/16 栅格；例外仅字形几何（--dot 5px、游标 2px），
      已在 tokens.css §6 列名。

溢出
  [x] stage overflow:hidden 作硬边界；21 组合零溢出、零 <12px、零裁切。

<style>
/* ==========================================================================
   design/tokens.css —— 内联副本（由构建步骤逐字拼入，不手工同步）
   ========================================================================== */
/* =============================================================================
   Agent Monitor — design tokens
   Layer 1  extracted verbatim from DESIGN.md (raycast) via design-system-extract
   Layer 2  project layer for the 960×540 @2x secondary display
   Naming is by PURPOSE, not by hue. Findings are at the bottom of this file.
   ========================================================================== */

:root {
  /* ==========================================================================
     1 · SURFACE LADDER — extracted (DESIGN.md › Colors › Surface)
     Elevation in this system is a background-color ladder, never a shadow.
     Each notch lighter reads as one step closer to the viewer.
     ====================================================================== */
  --canvas:            #07080a;  /* page ground, the dominant surface        */
  --surface:           #0d0d0d;  /* card / panel — one notch above canvas    */
  --surface-elevated:  #101111;  /* input fill, inactive track, active chip  */
  --surface-card:      #121212;  /* top notch — unread row, keycap, hover    */

  /* ==========================================================================
     2 · HAIRLINES — extracted (DESIGN.md › Elevation & Depth)
     ====================================================================== */
  --hairline:          #242728;               /* universal 1px card edge     */
  --hairline-soft:     rgba(255,255,255,.08); /* over-image / translucent    */
  --hairline-strong:   rgba(255,255,255,.16); /* stronger inline divider     */

  /* ==========================================================================
     3 · TEXT — extracted (DESIGN.md › Colors › Text)
     Contrast measured against --surface #0d0d0d (worst realistic case here):
       ink 17.69:1 · charcoal 12.99:1 · body 12.23:1 · mute 7.09:1
       ash 3.64:1  · stone 1.97:1
     ====================================================================== */
  --ink:               #f4f4f6;  /* headline / primary numerals             */
  --charcoal:          #d3d3d4;  /* body where ink reads too soft           */
  --body:              #cdcdcd;  /* default running text, bar fills         */
  --mute:              #9c9c9d;  /* metadata, labels, timestamps  (≥12px ok)*/
  --ash:               #6a6b6c;  /* 3.64:1 — NON-INFORMATIONAL MARKS ONLY   */
  --stone:             #434345;  /* 1.97:1 — never text; inactive track only*/

  /* ==========================================================================
     4 · SEMANTIC — extracted (DESIGN.md › Colors › Semantic)
     raycast scopes these to illustrations; this project promotes them to
     quota thresholds only (see §7). They are NOT accent.
     ====================================================================== */
  --ok:                #59d499;
  --warn:              #ffc533;
  --danger:            #ff6161;
  --info:              #57c1ff;
  --ok-soft:           rgba(89,212,153,.15);
  --warn-soft:         rgba(255,197,51,.15);
  --danger-soft:       rgba(255,97,97,.15);

  /* ==========================================================================
     5 · ACCENT — extracted (DESIGN.md: "white IS the brand action")
     The only true accent in the system. In this project it is rationed to
     「未读 / 需要你」 and capped at 2 visible uses per screen.
     ====================================================================== */
  --accent:            #f4f4f6;
  --accent-dim:        rgba(244,244,246,.55);  /* aged unread — see §7       */

  /* ==========================================================================
     6 · RADIUS + SPACING — extracted (DESIGN.md › Shapes / Layout)
     ====================================================================== */
  --r-xs: 4px;  --r-sm: 6px;  --r-md: 8px;  --r-lg: 10px;  --r-full: 9999px;

  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px;  --sp-md: 12px;
  --sp-lg: 16px; --sp-xl: 24px; --sp-xxl: 32px;

  /* OFF-SCALE EXCEPTIONS — 为 480×270 画布重写（R3-06）。
     上一版这张清单是给 960 画布写的，五条全部失效（值变了或规则已被砍），而画布上
     真正存在的四处 off-grid 值一条都没登记。下面是当前真实集合，由 Playwright 全量
     扫描每个计算出的 gap / padding / margin 比对 {2,4,8,12,16,24,32} 得出。
     每一项都是字形几何或硬性高度预算，不是节奏：
       · --dot 6px                未读圆点直径（R4-16 从 5px 回到 6px，它是全屏唯一
                                  的纯白 accent 载体，5px 在 0.16mm/px 上富余度太低）
       · --quota-notch-w 2px      填充末端缺口的线宽
       · V3 .band .caret 2px      「现在」游标线宽，与缺口同宽以示同源机制
       · V3 .tile padding 4px 8px 三条时间带要塞进 48px，纵向只剩得下 4px
     其余任何新增间距一律回到 2/4/8/12/16/24/32。 */

  /* ==========================================================================
     7 · PROJECT · IDENTITY COLORS  (added — DESIGN.md has no multi-brand slot)
     Categorical, not accent. Allowed on badges, dots and the V2 progress arc.
     Never on a fill wider than the arc stroke.
     ZCode is 智谱 #3b6cff re-plotted in OKLCH at Claude's exact L and C so no
     agent out-shouts another:  L .6724  C .1308  H 265.6  →  #6f93e6
     Measured on --surface: claude 6.23:1 · zcode 6.47:1 · codex 12.99:1

     REVISION 1 (lead, post-review · R1-01 / R1-03 / R2-11): Codex was #f4f4f6,
     the same hex as --accent, so every Codex dot counted as a visual accent and
     the attention state showed three equal-brightness white marks. Demoted to
     --charcoal, still neutral-white, half a step below accent. This also gives
     --charcoal a job (it was the one extracted-but-unused token, R1-08).
     ====================================================================== */
  --id-codex:          var(--charcoal);   /* #d3d3d4 */
  --id-claude:         #d97757;
  --id-zcode:          #6f93e6;

  /* ==========================================================================
     8 · PROJECT · QUOTA THRESHOLDS (added)
     ====================================================================== */
  --quota-normal:      var(--body);
  --quota-warn:        var(--warn);   /* ≥80% */
  --quota-danger:      var(--danger); /* ≥95% */
  /* REVISION 2 (lead, post-review · R1-02 / R2-01 / R2-08): every track-shaped
     graphic (V1 bar track, V2 gauge arc track, V3 band track, V3 timeline nodes)
     moves to --ash. --hairline measured 1.29:1 and --stone 1.97:1 against
     --surface; WCAG 1.4.11 puts a hard 3:1 floor on non-text UI components that
     carry information, and a track carries "how long is the whole thing".
     --ash is 3.64:1 on --surface and 3.75:1 on --canvas. The fills that ride on
     these tracks move to --ink so the fill edge keeps a 4.86:1 boundary. */
  --quota-track:       var(--ash);
  /* REVISION 4 (R3-03 / R4-03): the fill was --ink — the same hex as --accent.
     Measured in V3's populated state the two fills covered 1768 px² while the
     unread dot covered 25 px²: a 70:1 ratio, i.e. the brightest, largest shape
     on the screen was quota, not "someone needs you". Accent only works because
     it is scarce. Demoted to --charcoal: 3.57:1 against the --ash track, still
     over the 3:1 floor, and half a step below accent — the same move Q1 made on
     --id-codex, so the system stays self-consistent. */
  --quota-fill:        var(--charcoal);
  /* REVISION 4 (R3-01 / R3-02 / R4-02 / R4-04): every fill now ends in a 2px
     --canvas notch, the same mechanism as V3's "now" caret. Raising the track to
     --ash fixed track-vs-background but broke fill-vs-track in the danger tier
     (--danger on --ash measured 1.81:1). Colour cannot carry that boundary
     across three semantic tiers, so shape does: the notch measures 18.24:1 on
     ink, 13.39 on charcoal, 12.68 on warn, 6.81 on danger and 3.75 on the bare
     track — constant and tier-independent. Semantic red/yellow are untouched. */
  --quota-notch:       var(--canvas);
  --quota-notch-w:     2px;
  --quota-warn-at:     80;
  --quota-danger-at:   95;

  /* ==========================================================================
     9 · TYPOGRAPHY FAMILIES
     Inter extracted from DESIGN.md, ss03 mandatory ("without it the chrome
     loses its signature voice"). IBM Plex Mono added for numerals only —
     the single deliberate deviation, justified in 00-designer-notes.md.
     ====================================================================== */
  --font-sans: "Inter", "Inter Fallback", -apple-system, BlinkMacSystemFont,
               "Segoe UI", "PingFang SC", "Hiragino Sans GB",
               "Microsoft YaHei", system-ui, sans-serif;
  --font-num:  "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono",
               Menlo, Consolas, "Liberation Mono", monospace;
  --font-features: "calt" 1, "kern" 1, "liga" 1, "ss03" 1;
  --num-features: "tnum" 1, "zero" 1;   /* tabular figures + slashed zero    */

  /* ==========================================================================
     10 · PROJECT · TYPE SCALE for the 480×270 canvas (zoom 2 → 960×540)
     REVISION 3 (3.5" panel, brief-m0-35.md). The panel measured 3.5 inches,
     not 7: 1920×1080 physical on a 3.5" diagonal is ~629 ppi, so one canvas
     CSS px (= 4×4 physical px after zoom 2) is 0.16 mm — about 0.6× the
     0.26 mm of a px on an ordinary desktop monitor. The user compared 1x /
     1.5x / 2x on the real panel and picked 2x.
     Consequence: the scale is NOT the 960 scale halved. It is re-cut around
     the fact that only the big numeral and one enlarged title are readable
     from a seat 50–60 cm away; everything else is "recognisable at a glance".
     The 960×540 scale is preserved in design/variations-960x540.html.
     Seven steps, all used, 12px hard floor.
     ====================================================================== */
  /* R4-09 — 给之后复用这份 token 的 Electron 渲染层：在 0.16 mm/px 的这块屏上，
     12 / 13 / 14 三档的 modular step 是 1.08×，物理差 0.16 mm ≈ 1 弧分，低于分辨阈，
     **它们是同一个视觉档**。三者的层级区分完全由 --ink / --body / --mute 与位置承担，
     调 1px 字号调不出层级。真正起作用的只有三档：12–14 元数据 / 16–18 标题 /
     44–48 主数字。轮播版按 brief-m0-rotation.md 的新表把下限整体抬到 14px。 */
  --fs-micro:   12px;  /* floor — clock, status label, reason line, verdict  */
  --fs-label:   13px;  /* agent name, empty / error headline                 */
  --fs-unit:    14px;  /* percent sign suffix, second event row              */
  --fs-num-sm:  16px;  /* V3's demoted percentage                            */
  --fs-lead:    18px;  /* latest event title (brief floor is 16px)           */
  --fs-num-v2:  44px;  /* V2 primary numeral, beside the 56px arc           */
  --fs-num:     48px;  /* V1 primary numeral                                 */

  --lh-tight:  1.08;   /* numerals                                           */
  --lh-snug:   1.3;    /* headings, single-line rows                         */
  --lh-normal: 1.5;    /* running text                                       */

  --w-read:    400;
  --w-emph:    500;
  --w-announce:600;

  /* letter-spacing — the ALL-CAPS floor of 0.06em is a hard gate            */
  --tr-caps:   .08em;
  --tr-small:  .01em;  /* 12–13px                                            */
  --tr-body:   0;
  --tr-num:    -.02em; /* 48px numerals need negative tracking               */

  /* ==========================================================================
     11 · PROJECT · MOTION (added — DESIGN.md documents no motion at all)
     Motion is reserved for state change. Everything below is stripped under
     prefers-reduced-motion; only the instant switch survives.
     ====================================================================== */
  --dur-instant:  120ms;  /* hover / press                                   */
  --dur-state:    180ms;  /* state confirmation — the 150ms convergence      */
  --dur-bar:      300ms;  /* quota bar / arc advance                         */
  --dur-event:    360ms;  /* new event push-in (brief ceiling 400ms)         */
  --ease-standard: cubic-bezier(.2, 0, 0, 1);   /* M3 standard, front-loaded */
  --ease-exit:     cubic-bezier(.4, 0, 1, 1);
  --cycle-pulse:   2s;    /* running — agent badge                           */
  --cycle-breathe: 3s;    /* attention — brightness delta ≤8%                */

  /* ==========================================================================
     12 · PROJECT · GEOMETRY — 480×270 canvas, rendered at zoom 2
     REVISION 3. The canvas is authored at 480×270 and the whole stage carries
     zoom: 2, so it fills the panel's 960×540 logical resolution 1:1 and no
     layout is "shrunk to fit". Screenshots still come out 960×540 @2x.
     ====================================================================== */
  --screen-w:   480px;
  --screen-h:   270px;
  --screen-zoom: 2;
  --pad-screen: 8px;
  --gap-tile:   8px;
  --gap-block:  8px;
  --h-topbar:   16px;   /* clock only — the wordmark is cut on this canvas   */
  --h-tile:     137px;  /* V1 / V2 quota tile                                */
  --h-band:     48px;   /* V3 stacked time band                              */
  --h-row-lead: 44px;   /* enlarged latest event (V3 uses 64px, two lines)   */
  --h-row:      32px;   /* second event row — brief floor is 28px            */
  --gauge:      60px;   /* V2 arc, brief range 56–64px                       */
  /* R3-02 / R4-04: the progress arc is 4px wider than the track — 2px per side
     = 0.32 mm ≈ 2 arc-minutes at 55 cm, above the ~1 arc-minute resolution
     limit. The previous 1px total (0.5px/side ≈ 0.5 arc-minutes) was below it,
     so the identity-coloured arc had no usable separation from the track
     (Claude 1.71:1, ZCode 1.78:1 by luminance alone). */
  --arc-stroke: 8px;    /* progress arc                                      */

   invented; every hex traces to a line in DESIGN.md.

      action (white) and treats saturated color as illustration-only. A

/* 游标走暗色：无论落在 ash 轨道上还是落在填充里，都是一道高对比的缺口 */
/* R4-08 · 病根是填充的圆角右端与游标在 97% 处挤成一簇。填充右端改方角 + 末端加
   2px 缺口之后，97% 的填充与 98.8% 的游标在 446px 带宽上相隔 8px，不再重叠。
   游标保持 --canvas：--ink 会让它与 accent 同 hex（R3-03 刚把填充从那里拿走），
   而且 ink 叠在 charcoal 填充上只有 1.36:1。--canvas 对轨道 3.75、对各档填充 6.81–13.39。 */
[data-variant="v3"] .band .caret{position:absolute;top:0;bottom:0;width:2px;
  background:var(--quota-notch);margin-left:-1px}
[data-variant="v3"] .band .used{border-radius:var(--r-xs) 0 0 var(--r-xs)}
[data-variant="v3"] .b-note{font-size:var(--fs-micro);color:var(--mute);line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[data-variant="v3"] .row.lead{height:64px;grid-template-rows:auto auto;row-gap:4px;align-content:center}
[data-variant="v3"] .row.lead>:nth-child(1){grid-area:1/1/3/2;align-self:center}
[data-variant="v3"] .row.lead>:nth-child(2){grid-area:1/2/2/3}
[data-variant="v3"] .row.lead>:nth-child(3){grid-area:2/2/3/3}
[data-variant="v3"] .row.lead>:nth-child(4){grid-area:1/3/3/4;align-self:center}
[data-variant="v3"] .row.lead>:nth-child(5){grid-area:1/4/3/5;align-self:center}
[data-variant="v3"] .row.lead>:nth-child(6){grid-area:1/5/3/6;align-self:center}

  const ms = Math.max(0, new Date(iso).getTime() - ref);
  const m = Math.floor(ms/60000), h = Math.floor(m/60);
  return h > 0 ? `${h}h${p2(m%60)}m` : `${m}m`;
};
const elapsedFmt = ms => {
  const s = Math.max(0, Math.floor(ms/1000));
  return s < 3600 ? `${Math.floor(s/60)}m${p2(s%60)}s` : `${Math.floor(s/3600)}h${p2(Math.floor(s/60)%60)}m`;
};
const whenFmt = (iso, ref) => {
  const d = new Date(iso), diff = ref - d.getTime();
  if (diff < 60000) return "刚刚";
  if (diff < 3600000) return `${Math.floor(diff/60000)} 分钟前`;

};

const SCENES = {

if (!["v1","v2","v3"].includes(variant)) variant = "v1";

let scene = null;

const CAPTIONS = {
  v1:"<b>V1 · Ledger — 数字优先。</b>48px 百分比 + 12px 次级 7d + 3px 细 bar + 倒计时。砍掉了 7d 的独立 bar 和 cwd。三个数字一字排开，认得最快，也最没有形状记忆点。<b>← 推荐</b>",

};

function tileHead(t){
  const a = AGENTS[t.agent];

         `<span class="status"><span class="iddot"${t.status === "offline" ? ' data-off="1"' : ""}></span></span></div>`;

  if (t.status === "attention") return "ret";

    ? `<span class="attn-tag">${svg("ret",11)}等待你</span>`
    : `<span class="chip">${esc(a.tag)}</span>`;
  /* R4-01 · cwd 已被内容预算砍掉，这里不再回落到它——自检、笔记、简报三处都写了
     「cwd 已砍」，回落等于声明与实现相反。无 summary 时干脆不渲染副行，行高由
     .row.lead 的固定高度兜住，不会跳变。 */
  const sub = (variant === "v3" && isLead && it.summary)
    ? `<span class="rsub">${esc(it.summary)}</span>` : "";
  return `<button type="button" class="row${isLead ? " lead" : ""}" data-id="${esc(it.id)}" ` +
    `data-kind="${it.kind}" data-unread="${it.unread ? 1 : 0}" data-aged="${aged ? 1 : 0}" ` +
    `style="--idc:${a.color}" aria-label="${esc(label)}">` +
    first + `<span class="rtitle">${esc(it.title)}</span>` + sub +
    `<span class="rtime" ${timeAttr}></span>` +
    `<span class="rkind" data-kind="${it.kind}">${svg(icon,12)}</span>` +
    `<span class="rmark"></span></button>`;
}

function renderFeed(){
  const f = scene.feed;
  el.feedTitle.textContent = FEED_TITLE[state] || "最近完成";
  if (f.phase === "loading"){
    /* 事件区只有 85px：一条放大行的骨架 + 标签就到顶了，不再画第二条 */
    el.feedList.innerHTML = `<div class="feed-skel"><i></i>
      <span class="loading-label" role="status" style="padding:4px 8px 0">读取中</span></div>`;
    return;
  }
  if (f.phase === "msg"){
    el.feedList.innerHTML = `<div class="feed-msg msg" data-tone="${f.msg.tone}">
      <div class="msg-head">${svg(f.msg.icon,13)}<span>${esc(f.msg.title)}</span></div>
      <p>${esc(f.msg.why)}</p></div>`;
    return;
  }
  const shown = f.items.slice(0, ROW_BUDGET[variant]);
  const attn = shown.some(x => x.kind === "attention");
  /* accent 纪律：只有最上面那条「需要你 / 未读」拿全套强调 */
  let spent = false;
  el.feedList.innerHTML = shown.map((it, i) => {
    const full = !spent && (attn ? it.kind === "attention" : it.unread);
    if (full) spent = true;
    return rowHTML(it, i === 0, it.unread && !full);
  }).join("");
  tickFeed();
}

function render(){
  scene = SCENES[state]();
  root.dataset.variant = variant;
  root.dataset.state = state;
  renderTiles();
  renderFeed();
  if (state === "loading") el.live.textContent = "正在读取三个 agent 的额度与事件";
  tickClocks();
  el.legend.innerHTML = CAPTIONS[variant];
}

/* ---------- 逐秒增量更新（只改文本与位置，不重建 DOM，脉冲/呼吸不会被打断） ---------- */
function tickClocks(){
  const txt = hhmm(new Date(now()));
  document.querySelectorAll("[data-clock]").forEach(n => n.textContent = txt);
}
function tickTiles(){
  const t = now();
  el.tiles.querySelectorAll("[data-foot]").forEach(n => {
    const iso = n.dataset.foot, lv = n.dataset.level || "ok", st = n.dataset.status;
    /* V2 的倒计时归弧心独占（R3-08 / R4-07），所以它的 foot 永不带倒计时；
       ok 档 foot 退成弧心那串数字的说明「后重置」（R3-10：它原本是个裸串）。 */
    const nocd = n.dataset.nocd === "1";
    n.textContent =
      st === "attention" ? "等待你批准"
      : lv !== "ok"      ? (nocd ? (lv === "danger" ? "余量吃紧" : "余量偏紧")
                                 : `${countdown(iso, t)} · ${lv === "danger" ? "余量吃紧" : "余量偏紧"}`)
      : st === "running" ? (nocd ? "运行中" : `运行中 · ${countdown(iso, t)}`)
      :                    (nocd ? "后重置" : `${countdown(iso, t)} 后重置`);
  });
  el.tiles.querySelectorAll("[data-cd]").forEach(n => n.textContent = countdown(n.dataset.cd, t));
  el.tiles.querySelectorAll("[data-caret]").forEach(n => {
    const pct = Math.max(0, Math.min(100, ((t - Number(n.dataset.caret)) / WIN5H) * 100));
    n.style.left = pct.toFixed(2) + "%";
  });
  el.tiles.querySelectorAll("[data-verdict]").forEach(n => {
    const pct = Math.max(0, Math.min(100, ((t - Number(n.dataset.verdict)) / WIN5H) * 100));
    const used = Number(n.dataset.used), d = Math.round(Math.abs(used - pct)), over = used > pct;
    const st = n.dataset.status;
    if (st === "attention"){ n.dataset.tone = "attn"; n.textContent = "等待你批准"; return; }
    n.dataset.tone = over ? "over" : "under";
    /* R4-17 · 原文是「落后时钟 30 点 · 用不完」。「点」是百分点，是机制术语，
       要求用户先懂时间带的语义；而且它在 12px 上本来就读不出。只留结论。 */
    const verdict = over ? "按这个速度会提前用尽" : "按这个速度用不完";
    n.textContent = st === "running" ? `运行中 · ${verdict}` : verdict;
  });
}
function tickFeed(){
  const t = now();
  el.feedList.querySelectorAll("[data-when]").forEach(n => n.textContent = whenFmt(n.dataset.when, t));
  el.feedList.querySelectorAll("[data-elapsed]").forEach(n =>
    n.textContent = elapsedFmt(t - new Date(n.dataset.elapsed).getTime()));
}

/* ---------- 提示音：两个正弦 + 短衰减，≤200ms，不外链文件 ---------- */
let ac = null;
function chime(){
  if (rm === "1") return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const t = ac.currentTime, g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.055, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    g.connect(ac.destination);
    [[784, 1], [1174.7, 0.5]].forEach(([f, m]) => {
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(f, t);
      og.gain.setValueAtTime(m, t); o.connect(og); og.connect(g); o.start(t); o.stop(t + 0.2);
    });
  }catch(e){}
}

/* ---------- 模拟新事件 ---------- */
const POOL = [
  {agent:"codex",  title:"把 rollout jsonl 的增量解析补上 fixture 回归", cwd:"~/Projects/Monitor", summary:"新增 6 个解析用例，全部通过"},
  {agent:"claude", title:"给 statusline 包一层 tee，把 rate_limits 落盘", cwd:"~/.claude", summary:"脚本已就位，settings.json 已备份"},
  {agent:"zcode",  title:"训练集 b4 批次转写完成", cwd:"~/Downloads/VP语料生成", summary:"本批 68 条，去重后 64 条入库"},
  {agent:"codex",  title:"核对智谱 quota/limit 的 unit 枚举", cwd:"/private/tmp/v03_construct", summary:"3 = 小时、6 = 周，已确认"},
  {agent:"claude", title:"副屏窗口热插拔迁移的 displays.ts 草稿", cwd:"~/Projects/Monitor", summary:"按 label 优先、尺寸次之重新定位"},
];
let seq = 0;
const motionOn = () => rm !== "1" && !matchMedia("(prefers-reduced-motion:reduce)").matches;

function pushEvent(){
  if (!scene.feed.items){ state = "populated"; LS.set("am.state", state); syncSegs(); render(); }
  const s = POOL[seq++ % POOL.length];
  const item = {id:"new"+seq+"-"+Date.now(), agent:s.agent, kind:"completed",
    title:s.title, summary:s.summary, cwd:s.cwd, at:new Date(now()).toISOString(), unread:true};
  const anim = motionOn(), before = new Map();
  if (anim) el.feedList.querySelectorAll(".row").forEach(r => before.set(r.dataset.id, r.getBoundingClientRect().top));
  scene.feed.items.unshift(item);
  renderFeed();
  if (anim) el.feedList.querySelectorAll(".row").forEach(r => {
    const prev = before.get(r.dataset.id);
    if (prev == null){ r.classList.add("enter"); return; }
    const d = prev - r.getBoundingClientRect().top;
    if (!d) return;
    r.style.transition = "none"; r.style.transform = `translateY(${d}px)`;
    requestAnimationFrame(() => {
      r.style.transition = "transform var(--dur-event) var(--ease-standard)"; r.style.transform = "";
    });
  });
  chime();
  el.live.textContent = `新事件：${AGENTS[item.agent].name} ${item.title}`;
}

/* ---------- ack ---------- */
el.feedList.addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row || !scene.feed.items) return;
  const it = scene.feed.items.find(x => x.id === row.dataset.id);
  if (!it || !it.unread) return;
  it.unread = false;
  renderFeed();
  const again = el.feedList.querySelector(`.row[data-id="${CSS.escape(it.id)}"]`);
  if (again) again.focus();
  const left = scene.feed.items.filter(x => x.unread).length;
  el.live.textContent = left ? `已标记已读，还剩 ${left} 条未读` : "已全部读完";
});

/* ---------- 控制栏 ---------- */
function syncSegs(){
  document.querySelectorAll("#segVariant button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === variant)));
  document.querySelectorAll("#segState button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === state)));
}
document.getElementById("segVariant").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  variant = b.dataset.v; LS.set("am.variant", variant); syncSegs(); render();
});
document.getElementById("segState").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state = b.dataset.s; LS.set("am.state", state); syncSegs(); render();
});
document.getElementById("btnPush").addEventListener("click", pushEvent);
const chk = document.getElementById("chkRm");
chk.addEventListener("change", () => { rm = chk.checked ? "1" : "0"; root.dataset.rm = rm; LS.set("am.rm", rm); });

chk.checked = rm === "1";
root.dataset.rm = rm;
syncSegs();
render();
setInterval(() => { tickClocks(); tickTiles(); tickFeed(); }, 1000);
})();
</script>
