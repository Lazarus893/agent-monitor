<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=960">
<title>Agent Monitor · 3.5 寸字号比对</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #07080a; color: #cdcdcd; }
  body {
    width: 960px; height: 540px; overflow: hidden; box-sizing: border-box;
    padding: 12px 16px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    font-feature-settings: "calt", "kern", "liga", "ss03";
    display: flex; flex-direction: column; gap: 10px;
  }
  .hint { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #9c9c9d; display: flex; justify-content: space-between; }
  .row { display: flex; align-items: center; gap: 0; border: 1px solid #242728; border-radius: 10px; background: #0d0d0d; padding: 0 16px; flex: 0 0 auto; }
  .tag { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; color: #9c9c9d; width: 150px; flex: 0 0 150px; line-height: 1.5; }
  .tag b { display: block; color: #f4f4f6; font-size: 14px; font-weight: 500; }
  .sample { display: flex; align-items: center; gap: 20px; padding: 10px 0; }
  .num { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; font-size: 48px; font-weight: 500; line-height: 1; color: #f4f4f6; letter-spacing: -.02em; }
  .num small { font-family: "Inter", sans-serif; font-size: 13px; font-weight: 400; color: #9c9c9d; letter-spacing: 0; margin-left: 6px; }
  .txt { display: flex; flex-direction: column; gap: 4px; }
  .title { font-size: 16px; line-height: 1.3; color: #f4f4f6; font-weight: 500; }
  .meta { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 13px; color: #9c9c9d; font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #d97757; flex: 0 0 8px; }
  .s15 .sample { zoom: 1.5; }
  .s20 .sample { zoom: 2; }
</style>
</head>
<body>
  <div class="hint"><span>字号比对 · 把这个窗口放到 3.5 寸副屏并最大化</span><span>坐在平时的位置看</span></div>

  <div class="row s10">
    <div class="tag"><b>1x · 960×540</b>现状 · 13 / 16 / 48 px</div>
    <div class="sample"><span class="dot"></span><span class="num">18%<small>5h</small></span><span class="txt"><span class="title">合并四个文件并添加训练评估集标签列</span><span class="meta">17:00 重置 · 2h26m · ~/Downloads/v0.2 分类模型训练数据</span></span></div>
  </div>

  <div class="row s15">
    <div class="tag"><b>1.5x · 640×360</b>推荐 · 同一套字号放大 1.5 倍</div>
    <div class="sample"><span class="dot"></span><span class="num">18%<small>5h</small></span><span class="txt"><span class="title">合并四个文件并添加训练评估集标签列</span><span class="meta">17:00 重置 · 2h26m</span></span></div>
  </div>

  <div class="row s20">
    <div class="tag"><b>2x · 480×270</b>坐得远选这档 · 放大 2 倍</div>
    <div class="sample"><span class="dot"></span><span class="num">18%<small>5h</small></span><span class="txt"><span class="title">合并四个文件并添加标签列</span><span class="meta">17:00 重置 · 2h26m</span></span></div>
  </div>
</body>
</html>
